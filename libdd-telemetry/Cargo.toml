[package]
name = "libdd-telemetry"
version= "10.0.0"
description = "Telemetry client allowing to send data as described in https://docs.datadoghq.com/tracing/configure_data_security/?tab=net#telemetry-collection"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-telemetry"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-telemetry"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
bench = false

[[example]]
name = "tm-metrics-worker-test"
required-features = ["std"]

[[example]]
name = "tm-ping"
required-features = ["std"]

[[example]]
name = "tm-send-sketch"
required-features = ["std"]

[[example]]
name = "tm-worker-test"
required-features = ["std"]

[features]
default = ["std", "tracing"]
alloc = ["dep:serde_json", "libdd-common/alloc", "serde/alloc"]
std = [
    "alloc",
    "dep:anyhow",
    "dep:async-trait",
    "dep:base64",
    "dep:bytes",
    "dep:futures",
    "dep:hashbrown",
    "dep:http",
    "dep:libc",
    "dep:libdd-capabilities",
    "dep:libdd-ddsketch",
    "dep:libdd-shared-runtime",
    "dep:sys-info",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:uuid",
    "dep:web-time",
    "dep:winver",
    "libdd-common/std",
    "serde/std",
    "serde_json/std",
]
tracing = ["std", "tracing/std"]
https = ["std", "libdd-common/https", "libdd-shared-runtime/https"]
fips = ["std", "libdd-common/fips", "libdd-shared-runtime/fips"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, features = ["std"], optional = true }
futures = { workspace = true, optional = true }
http = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
strum.workspace = true
strum_macros.workspace = true
tokio = { workspace = true, features = ["sync", "io-util"], optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "std"], optional = true }
# Only HashTable (ungated) and DefaultHashBuilder (default-hasher) are used.
hashbrown = { workspace = true, default-features = true, optional = true }
bytes = { workspace = true, features = ["std"], optional = true }
libdd-capabilities = { version = "4.0.1", path = "../libdd-capabilities", optional = true }
libdd-common = { version = "8.0.0", path = "../libdd-common", default-features = false }
libdd-shared-runtime = { version = "6.0.0", path = "../libdd-shared-runtime", default-features = false, optional = true }
libdd-ddsketch = { version = "1.1.3", path = "../libdd-ddsketch", optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-info = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js", "std"], optional = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true, optional = true }

[target."cfg(windows)".dependencies]
winver = { workspace = true, optional = true }

[dev-dependencies]
# Examples only call fmt(); ansi/tracing-log/smallvec extras not needed.
tracing-subscriber = { workspace = true, features = ["fmt"] }
tokio = { workspace = true, features = ["sync", "io-util", "rt-multi-thread"] }
libdd-capabilities-impl = { path = "../libdd-capabilities-impl" }
libdd-common = { path = "../libdd-common", features = ["test-utils"] }
httpmock.workspace = true
