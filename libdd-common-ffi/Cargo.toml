[package]
name = "libdd-common-ffi"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
bench =false

[features]
default = ["std", "cbindgen"]
std = ["dep:anyhow", "dep:chrono", "dep:crossbeam-queue", "dep:hyper", "dep:serde", "dep:libdd-common"]
cbindgen = ["std", "build_common/cbindgen"]
regex-lite = ["std", "libdd-common/regex-lite"]

[build-dependencies]
build_common = { path = "../build-common" }

[dependencies]
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, features = ["clock", "std"], optional = true }
crossbeam-queue = { workspace = true, default-features = true, optional = true }
libdd-common = { path = "../libdd-common", optional = true }
hyper = { workspace = true, features = ["http1", "client"], optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
bolero = { workspace = true, features = ["std"] }
assert_no_alloc.workspace = true
function_name.workspace = true

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
