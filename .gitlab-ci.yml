variables:
  # These are gitlab variables so that it's easier to do a manual deploy
  # If these are set witih value and description, then it gives you UI elements
  DOWNSTREAM_BRANCH:
    value: "main"
    description: "downstream jobs are triggered on this branch"

  # To bump: docker buildx imagetools inspect registry.ddbuild.io/ci/benchmarking-platform:libdatadog-benchmarks
  BASE_CI_IMAGE: registry.ddbuild.io/ci/benchmarking-platform:libdatadog-benchmarks@sha256:941d9b580302c07194e9bd2141d5f47c6cfb97d5a73c8ce9af2fce7a76034a0b

  # To bump: get commit sha from repo: https://gitlab.ddbuild.io/DataDog/benchmarking-platform branch: libdatadog/benchmarks
  BENCHMARKING_PLATFORM_SHA: "1d6ed8466bbe6e8fca75f899a7ec3bdc3003ce4e"

include:
  - local: .gitlab/impacted-crates.yml
  - local: .gitlab/benchmarks.yml
  - local: .gitlab/fuzz.yml

.untrusted_ref_guard:
  rules:
    - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_REPOSITORY && $CI_EXTERNAL_PULL_REQUEST_SOURCE_REPOSITORY != $CI_EXTERNAL_PULL_REQUEST_TARGET_REPOSITORY'
      when: never

trigger_internal_build:
  variables:
    LIBDATADOG_COMMIT_BRANCH: $CI_COMMIT_BRANCH
    LIBDATADOG_COMMIT_SHA: $CI_COMMIT_SHA
    LIBDATADOG_SHORT_COMMIT_SHA: ${CI_COMMIT_SHORT_SHA}
    LIBDATADOG_COMMIT_TAG: $CI_COMMIT_TAG
    LIBDATADOG_PULL_REQUEST_ID: $CI_EXTERNAL_PULL_REQUEST_IID
    LIBDATADOG_BASE_COMMIT_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    LIBDATADOG_COMMIT_BEFORE_SHA: $CI_COMMIT_BEFORE_SHA
    LIBDATADOG_COMMIT_TITLE: $CI_COMMIT_TITLE
    LIBDATADOG_ENABLE_MACOS_JOBS: "false"
    LIBDATADOG_IS_RELEASE_BRANCH: "false"
    LIBDATADOG_IS_HOTFIX_BRANCH: "false"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        LIBDATADOG_IS_RELEASE_BRANCH: "true"
      when: always
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\//'
      variables:
        LIBDATADOG_IS_RELEASE_BRANCH: "true"
        LIBDATADOG_IS_HOTFIX_BRANCH: "true"
      when: always
    - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        LIBDATADOG_ENABLE_MACOS_JOBS: "true"
      when: always
    - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
      variables:
        LIBDATADOG_ENABLE_MACOS_JOBS: "true"
      when: always
    - when: always
  trigger:
    project: DataDog/apm-reliability/libddprof-build
    strategy: depend
    branch: $DOWNSTREAM_BRANCH
