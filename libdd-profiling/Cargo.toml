[package]
name = "libdd-profiling"
version = "2.0.0"
description = "Continuous profiling library supporting pprof and OTel formats"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-profiling"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[lib]
# Only an rlib: Rust consumers supply their own panic handler. The checked
# release artifact is built separately as a cdylib with a sentinel handler.
crate-type = ["lib"]
bench = false

[features]
default = []
alloc = []
pprof = ["alloc"]
otel = ["alloc", "gzip"]
gzip = ["alloc", "dep:compcol"]
zstd = ["alloc", "dep:zstd-sys"]

[dependencies]
compcol = { workspace = true, features = ["gzip", "embed"], optional = true }
# HashMap's key-lookup trait, the same one hashbrown and indexmap use.
equivalent.workspace = true
foldhash.workspace = true
# `experimental` exposes ZSTD_customMem.
zstd-sys = { workspace = true, features = ["experimental"], optional = true }

[target.'cfg(unix)'.dependencies]
# Memory mapping and the process lock file.
# allow(workspace-deps): the workspace entry enables libc's `std` feature,
# which drops libc's own link to the C library on the assumption that std
# links it. This crate is no_std, so its artifacts need libc to link it.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
prost = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
flate2 = { workspace = true, features = ["rust_backend"] }
zstd.workspace = true

[lints]
workspace = true
