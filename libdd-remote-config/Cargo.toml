[package]
edition = "2021"
name = "libdd-remote-config"
version = "4.0.0"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-remote-config"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-remote-config"
description = "Datadog Remote Configuration client and config parsers"

[features]
default = ["client", "https"]
agentless = [
    "dep:ring",
    "dep:tuf",
    "dep:chrono",
    "dep:prost",
    "dep:rand",
    "client",
    "libdd-capabilities-impl/https",
]
client = [
    "libdd-trace-protobuf",
    "bytes",
    "http-body-util",
    "http",
    "base64",
    "sha2",
    "uuid",
    "getrandom",
    "dep:futures",
    "futures-util",
    "tokio",
    "tokio-util",
    "manual_future",
    "time",
    "tracing",
]

regex-lite = ["libdd-common/regex-lite"]
# Enable HTTPS support in the fetcher (rustls + ring via libdd-common).
https = ["libdd-common/https", "libdd-capabilities-impl/https"]
# FIPS-compliant crypto provider (aws-lc-rs via libdd-common). Unix only.
fips = ["libdd-common/fips", "libdd-capabilities-impl/fips"]
test = ["hyper/server", "hyper-util"]

[dependencies]
anyhow.workspace = true
bytes = { workspace = true, features = ["std"], optional = true }
libdd-common = { path = "../libdd-common", version = "5.2.0", default-features = false }
libdd-capabilities = { path = "../libdd-capabilities", version = "3.0.1" }
libdd-trace-protobuf = { path = "../libdd-trace-protobuf", version = "5.0.0", optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "client"] }
http-body-util = { workspace = true, optional = true }
http = { workspace = true, features = ["std"], optional = true }
base64 = { workspace = true, features = ["std"], optional = true }
sha2 = { workspace = true, features = ["std"], optional = true }
getrandom = { version = "0.2", optional = true }
uuid = { workspace = true, features = ["std"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true, features = ["macros"] }
tokio-util = { version = "0.7.10", optional = true }
manual_future = { version = "0.1.1", optional = true }
time = { version = "0.3", features = [
    "parsing",
    "serde",
    "formatting",
], optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_with = "3"
rand = { version = "0.8.5", optional = true }
thiserror = "1"
hashbrown = "0.17"
tuf = { package = "libdd-tuf", version = "0.3.1", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }
prost = { version = "0.14.1", optional = true }
futures = { version = "0.3", optional = true }
# `EnumIter` for external consumers to make struct available to runtime
strum = { version = "0.26", default-features = false }
strum_macros = "0.26"

# Test feature
hyper-util = { workspace = true, features = [
    "http1",
    "client",
    "client-legacy",
    "service",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# For `tuf` ring needs this feature for `SystemRandom` on wasm.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libdd-capabilities-impl = { path = "../libdd-capabilities-impl", version = "4.0.0", default-features = false }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
futures.workspace = true
libdd-remote-config = { path = ".", features = ["test"] }

[lib]
bench = false
