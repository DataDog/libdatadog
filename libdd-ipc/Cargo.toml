[package]
name = "libdd-ipc"
version = "0.1.0"
description = "IPC implementation for libdatadog"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-ipc"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-ipc"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
zwohash = "0.1.2"
bincode = { version = "1" }
futures.workspace = true
io-lifetimes = { workspace = true, features = ["close"] }
page_size = "0.6.0"
memfd = { version = "0.6" }
serde = { workspace = true, features = ["derive"] }
libc.workspace = true
libdd-tinybytes = { path = "../libdd-tinybytes", optional = true }


libdd-common = { version = "5.2.0", path = "../libdd-common" }
libdd-ddsketch = { version = "1.1.0", path = "../libdd-ddsketch" }
libdd-trace-protobuf = { version = "4.0.1", path = "../libdd-trace-protobuf" }
libdd-trace-stats = { version = "7.0.0", path = "../libdd-trace-stats" }
libdd-ipc-macros = { version = "0.0.1", path = "../libdd-ipc-macros" }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions = "1.3"
tempfile.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "rt",
    "tracing",
    "fs",
    "io-util",
] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.22" }
spawn_worker = { path = "../spawn_worker" }

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.29", features = ["fs", "mman", "process", "poll", "socket", "uio", "user"] }
sendfd = { version = "0.4", features = ["tokio"] }
tokio = { version = "1.23", features = ["sync", "io-util", "signal"] }

[target.'cfg(target_env = "gnu")'.build-dependencies]
glibc_version = "0.1.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["handleapi", "memoryapi", "winbase", "winnt", "winerror", "processthreadsapi", "fileapi", "minwinbase"] }
windows-sys = { version = "0.48.0", features = ["Win32_System", "Win32_System_WindowsProgramming", "Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
tokio = { version = "1.23", features = ["sync", "io-util", "signal", "net", "rt-multi-thread", "rt"] }

[lib]
bench = false

[[bench]]
harness = false
name = "ipc"
path = "benches/ipc.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(polyfill_glibc_memfd)'] }

[features]
tiny-bytes = ["libdd-tinybytes"]
# Wake `OneWayShmReader::wait_for_change` via a futex on the generation word
# (Linux only). Without this, the wait falls back to a timed poll.
one_way_shm_futex = []
