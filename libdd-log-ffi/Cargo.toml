[package]
name = "libdd-log-ffi"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
default = ["cbindgen", "expanded_builder_macros"]
cbindgen = ["build_common/cbindgen", "libdd-types-ffi/cbindgen", "expanded_builder_macros"]
expanded_builder_macros = []
regex-lite = ["libdd-regex/regex-lite"]

[build-dependencies]
build_common = { path = "../build-common" }

[dependencies]
libdd-log = { path = "../libdd-log" }
libdd-types-ffi = { path = "../libdd-types-ffi" }
libdd-regex = { path = "../libdd-regex" }

[package.metadata.cargo-machete]
ignored = ["libdd-regex"]
