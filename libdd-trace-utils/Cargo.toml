[package]
name = "libdd-trace-utils"
version = "11.0.0"
description = "Trace utilities including span processing, MessagePack encoding/decoding, payload handling, and HTTP transport with retry logic for Datadog APM"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-utils"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-utils"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[lib]
bench = false

[[bench]]
name = "main"
harness = false
path = "benches/main.rs"

[[bench]]
name = "vec_map_bench"
harness = false
path = "benches/vec_map_bench.rs"
required-features = ["bench-internals"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
hex = "0.4"
itoa = "1.0"
hyper = { workspace = true, optional = true, features = ["http1", "client"] }
"http" = "1"
"http-body" = "1"
http-body-util = "0.1"
serde = { workspace = true, features = ["derive"] }
prost = "0.14.1"
rmp-serde = "1.3.0"
tracing.workspace = true
serde_json = { workspace = true, features = ["std"] }
serde-transcode = "1.1"
futures.workspace = true
tokio = { workspace = true, features = ["macros"] }
rand = "0.8.5"
bytes = "1.11.1"
rmpv = { version = "1.3.0", default-features = false }
rmp = { version = "0.8.14", default-features = false }
rustc-hash = "2.1.1"

libdd-capabilities = { path = "../libdd-capabilities", version = "3.0.0" }
libdd-common = { version = "5.2.0", path = "../libdd-common", default-features = false }
libdd-trace-normalization = { version = "3.0.1", path = "../libdd-trace-normalization" }
libdd-trace-protobuf = { version = "5.0.0", path = "../libdd-trace-protobuf" }
libdd-tinybytes = { version = "1.1.2", path = "../libdd-tinybytes", features = [
    "bytes_string",
    "serialization",
] }
indexmap = "2.11"
thin-vec = "0.2"

# Compression feature
flate2 = { version = "1.0", optional = true }

# test-utils feature
cargo_metadata = { version = "0.18.1", optional = true }
# Dependency of cargo metadata, but 0.1.8 requires too new of a rust version.
cargo-platform = { version = "=0.1.7", optional = true }
httpmock = { version = "0.8.0-alpha.1", optional = true }
urlencoding = { version = "2.1.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
libdd-capabilities-impl = { version = "4.0.0", path = "../libdd-capabilities-impl", default-features = false }
zstd = { version = "0.13.3", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
zrip = { version = "=0.6.0", default-features = false, features = ["frame"], optional = true }

[dev-dependencies]
libdd-capabilities-impl = { version = "4.0.0", path = "../libdd-capabilities-impl" }
libdd-common = { path = "../libdd-common", default-features = false, features = [
    "bench-utils",
] }
bolero = { workspace = true, features = ["std"] }
criterion.workspace = true
httpmock = { version = "0.8.0-alpha.1" }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
libdd-trace-utils = { path = ".", features = ["test-utils"] }
tempfile.workspace = true

[features]
default = ["https"]
https = ["libdd-common/https", "libdd-capabilities-impl/https"]
mini_agent = ["compression", "libdd-common/use_webpki_roots", "dep:flate2"]
test-utils = [
    "hyper/server",
    "httpmock",
    "cargo_metadata",
    "cargo-platform",
    "urlencoding",
]
change-buffer = []
# Opt-in switch for crate-internal microbenchmarks (e.g. `vec_map_bench`).
bench-internals = []
compression = ["zstd"]
# Preserve the existing public feature while selecting the implementation by
# target: zstd on native platforms and zrip on WASM.
zstd = ["dep:zstd", "dep:zrip"]
# FIPS mode uses the FIPS-compliant cryptographic provider (Unix only)
fips = ["libdd-common/fips", "libdd-capabilities-impl/fips"]
