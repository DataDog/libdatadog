[package]
name = "libdd-trace-utils"
version = "12.0.0"
description = "Trace utilities including span processing, MessagePack encoding/decoding, payload handling, and HTTP transport with retry logic for Datadog APM"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-utils"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-utils"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[lib]
bench = false

[[bench]]
name = "main"
harness = false
path = "benches/main.rs"

[[bench]]
name = "vec_map_bench"
harness = false
path = "benches/vec_map_bench.rs"
required-features = ["bench-internals"]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, features = ["std"] }
hex = { workspace = true, default-features = true }
itoa.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "client"] }
"http" = { workspace = true, features = ["std"] }
http-body.workspace = true
http-body-util.workspace = true
serde = { workspace = true, features = ["derive"] }
# Only uses the prost::Message trait on generated types; no local derives.
prost = { workspace = true, features = ["std"] }
rmp-serde.workspace = true
tracing.workspace = true
serde_json = { workspace = true, features = ["std"] }
serde-transcode.workspace = true
futures.workspace = true
rand = { workspace = true, default-features = true, features = ["small_rng"] }
bytes = { workspace = true, features = ["std"] }
rmpv.workspace = true
rmp.workspace = true
rustc-hash = { workspace = true, default-features = true }
crossbeam-channel = { workspace = true, features = ["std"] }
thread_local.workspace = true 

libdd-capabilities = { path = "../libdd-capabilities", version = "3.0.1" }
libdd-common = { version = "6.0.0", path = "../libdd-common", default-features = false }
libdd-trace-normalization = { version = "4.0.0", path = "../libdd-trace-normalization" }
libdd-trace-protobuf = { version = "5.0.0", path = "../libdd-trace-protobuf" }
libdd-tinybytes = { version = "1.1.3", path = "../libdd-tinybytes", features = [
    "bytes_string",
    "serialization",
] }
indexmap = { workspace = true, default-features = true }
thin-vec = { workspace = true, default-features = true }

# Compression feature
flate2 = { workspace = true, optional = true }

# test-utils feature
cargo_metadata = { workspace = true, optional = true }
# Dependency of cargo metadata, but 0.1.8 requires too new of a rust version.
cargo-platform = { workspace = true, optional = true }
httpmock = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libdd-capabilities-impl = { version = "5.0.0", path = "../libdd-capabilities-impl", default-features = false, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
zstd = {workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
zrip = { workspace = true, features = ["frame"], optional = true }

[dev-dependencies]
libdd-capabilities-impl = { version = "5.0.0", path = "../libdd-capabilities-impl" }
libdd-common = { path = "../libdd-common", default-features = false, features = [
    "bench-utils",
] }
bolero = { workspace = true, features = ["std"] }
criterion.workspace = true
httpmock.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
libdd-trace-utils = { path = ".", features = ["test-utils"] }
tempfile.workspace = true

[features]
default = ["https"]
https = ["libdd-common/https", "dep:libdd-capabilities-impl", "libdd-capabilities-impl/https"]
mini_agent = [
    "compression",
    "libdd-common/http-client",
    "libdd-common/use_webpki_roots",
    "dep:flate2",
]
test-utils = [
    "dep:tokio",
    "libdd-common/http-client",
    "hyper/server",
    "httpmock",
    "cargo_metadata",
    "cargo-platform",
    "urlencoding",
]
change-buffer = []
# Opt-in switch for crate-internal microbenchmarks (e.g. `vec_map_bench`).
bench-internals = []
compression = ["zstd"]
# Preserve the existing public feature while selecting the implementation by
# target: zstd on native platforms and zrip on WASM.
zstd = ["dep:zstd", "dep:zrip"]
# FIPS mode uses the FIPS-compliant cryptographic provider (Unix only)
fips = ["libdd-common/fips", "dep:libdd-capabilities-impl", "libdd-capabilities-impl/fips"]
