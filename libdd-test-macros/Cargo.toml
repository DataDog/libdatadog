[package]
name = "libdd-test-macros"
version = "0.0.1"
description = "Test attribute macros for libdatadog's own test suites"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
proc-macro = true
bench = false

[dependencies]
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { workspace = true, features = ["full", "parsing", "printing", "clone-impls", "proc-macro"] }

[dev-dependencies]
test-case.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
