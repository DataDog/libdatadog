[package]
name = "libdd-profiling-ffi"
version = "2.0.0"
description = "C API for libdd-profiling: profiles lowered to pprof or OTLP, as HTTP requests to send"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
links = "datadog_profiling_ffi"

[lib]
name = "datadog_profiling_ffi"
# Only an rlib: hosts such as dd-trace-py's `_native` link it into their own
# library and supply std's panic handler and allocator. The verified C
# artifact is built separately as a cdylib with `--cfg ddprof_ffi_cdylib`
# (see scripts/check-profiling-ffi-no-panic.sh), which adds a sentinel panic
# handler and a malloc-backed allocator.
crate-type = ["lib"]
bench = false

[features]
default = ["pprof", "otel", "zstd"]
# The output formats, forwarded to libdd-profiling. Each adds its request
# functions; either, both or neither may be enabled. The header declares all
# of them; dependents see which were built in through build-script metadata
# (DEP_DATADOG_PROFILING_FFI_PPROF / _OTEL / _GZIP / _ZSTD, see build.rs).
pprof = ["libdd-profiling/pprof"]
otel = ["libdd-profiling/otel"]
# gzip compression for either format (`otel` always has it); the pprof
# default when zstd is not built in.
gzip = ["libdd-profiling/gzip"]
# zstd compression for either format; the pprof default when built in.
zstd = ["libdd-profiling/zstd"]

[dependencies]
libdd-profiling = { path = "../libdd-profiling", features = ["alloc"] }
# The cdylib's global allocator calls the C runtime's malloc and friends (on
# Windows too, where over-aligned blocks use `_aligned_malloc`).
# allow(workspace-deps): the workspace entry enables libc's `std` feature,
# which drops libc's own link to the C library; this no_std artifact needs it.
libc = { version = "0.2", default-features = false }

[lints]
workspace = true
