[package]
edition = "2021"
name = "spawn_worker"
version = "0.0.1"
publish = false

[lib]
bench = false

[dependencies]
anyhow.workspace = true
io-lifetimes = { workspace = true, features = ["close"] }
fastrand = { workspace = true, features = ["std"] }
libc.workspace = true

[build-dependencies]
cc_utils = { path = "../tools/cc_utils" }

# allow(workspace-deps): this crate is still on the windows 0.51 bindings,
# while the workspace entry tracks 0.59 for the crashtracker crates. Moving
# it over is an API migration that needs a Windows build to validate.
[target.'cfg(windows)'.dependencies.windows]
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
]
version = "0.51.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
memfd.workspace = true
nix = { workspace = true, features = ["dir", "process"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[target.'cfg(not(windows))'.dev-dependencies]
rlimit.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
