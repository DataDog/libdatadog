[package]
name = "libdd-otel-thread-ctx-ffi"
version = "1.0.0"
description = "FFI bindings for the OTel thread-level context publisher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
bench = false

[dependencies]
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false, optional = true }
libdd-otel-thread-ctx = { path = "../libdd-otel-thread-ctx" }

[features]
default = ["cbindgen"]
cbindgen = ["build_common/cbindgen", "libdd-common-ffi/cbindgen"]
sanity-check = ["dep:libdd-common-ffi", "libdd-otel-thread-ctx/sanity-check"]
# Autoclean contexts on thread exit, forwarding the same feature from
# `libdd-otel-thread-ctx`: any context left attached when the thread exits is freed by Rust's
# TLS destructor mechanism, with nothing required from the host. See that crate's README
# ("Context records lifecycle" section).
thread-exit-autoclean = ["libdd-otel-thread-ctx/thread-exit-autoclean"]

# End-to-end test for the `thread-exit-autoclean` feature. Uses its own binary (and process) with
# `harness = false` so that it runs in a dedicated process with a minimal thread population (the
# main thread and a single worker thread), which keeps the record lifecycle observation
# deterministic. The lib's `test-utils` feature (which this test needs for the raw TLS slot
# accessor) is enabled through the dev-dependencies below.
[[test]]
name = "thread_exit_autoclean"
required-features = ["thread-exit-autoclean"]
harness = false

[dev-dependencies]
libdd-otel-thread-ctx = { path = "../libdd-otel-thread-ctx", features = [
    "sanity-check",
    "test-utils",
] }

[build-dependencies]
build_common = { path = "../build-common" }
