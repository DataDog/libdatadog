[package]
name = "libdd-trace-obfuscation"
version = "11.0.0"
description = "A duplicate of trace obfuscator implemented in the agent and documented in https://docs.datadoghq.com/tracing/configure_data_security/?tab=net#trace-obfuscation"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-obfuscation"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-trace-obfuscation"
keywords = ["datadog", "trace", "obfuscation"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
percent-encoding = { workspace = true, features = ["std"] }
log.workspace = true
fluent-uri.workspace = true
libdd-trace-protobuf = { version = "5.1.1", path = "../libdd-trace-protobuf" }
libdd-trace-model = { version = "1.0.0", path = "../libdd-trace-model" }
libdd-trace-utils = { version = "15.0.0", path = "../libdd-trace-utils", default-features = false }
libdd-regex = { version = "0.1.0", path = "../libdd-regex" }
libdd-env = { version = "0.1.0", path = "../libdd-env" }

[features]
default = ["https"]
https = ["libdd-trace-utils/https"]
fips = ["libdd-trace-utils/fips"]
regex-lite = ["libdd-regex/regex-lite"]

[dev-dependencies]
duplicate = { workspace = true, default-features = true }
criterion = { workspace = true, features = ["csv_output"] }
libdd-trace-utils = { path = "../libdd-trace-utils", features = ["test-utils"] }
libdd-tinybytes = { version = "1.2.0", path = "../libdd-tinybytes" }
tools = { path = "../tools", default-features = false, features = ["bench-utils"] }

[lib]
bench = false

[[bench]]
name = "trace_obfuscation"
harness = false
path = "benches/trace_obfuscation.rs"

[lints]
workspace = true
