[package]
edition.workspace = true
rust-version.workspace = true
name = "sidecar_mockgen"
version = "0.1.0"
publish = false

[lib]
bench = false

[dependencies]
# Reads ELF/Mach-O symbol tables.
object = { workspace = true, default-features = true }

[[bin]]
name = "sidecar_mockgen"
bench = false

[lints.clippy]
# TODO(paullgdc): This fails a lot because of if-let chaining which became
# allowed with the 1.91.1 MSRV bump.
# I am planning to fix each crate as an individual PR in order to not have 
# too many conflicts
collapsible_if = "allow"
