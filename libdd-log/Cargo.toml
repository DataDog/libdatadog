[package]
name = "libdd-log"
version = "1.0.0"
description = "A bridge from Rust to {language} logging"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-log"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-log"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
# TODO(paullgdc): This fails a lot because of if-let chaining which became
# allowed with the 1.91.1 MSRV bump.
# I am planning to fix each crate as an individual PR in order to not have 
# too many conflicts
collapsible_if = "allow"
