[package]
name = "libdd-data-pipeline"
version= "10.0.0"
description = "Trace exporter package allowing sending data from datadog SDKs to the Trace Agent."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-data-pipeline"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-data-pipeline"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
autobenches = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arc-swap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
http = { workspace = true, features = ["std"] }
http-body-util.workspace = true
tracing.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
either = { workspace = true, default-features = true }
futures = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "time",
] }
uuid = { workspace = true, features = ["v4", "std"] }
tokio-util.workspace = true
libdd-capabilities = { path = "../libdd-capabilities", version = "3.0.1" }
libdd-data-pipeline-core = { path = "../libdd-data-pipeline-core", version = "1.0.0" }
libdd-common = { version = "6.0.0", path = "../libdd-common", default-features = false }
libdd-shared-runtime = { version = "4.0.0", path = "../libdd-shared-runtime", default-features = false }
libdd-telemetry = { version = "8.0.0", path = "../libdd-telemetry", default-features = false, optional = true}
libdd-trace-protobuf = { version = "5.0.0", path = "../libdd-trace-protobuf" }
libdd-trace-normalization = { version = "4.0.0", path = "../libdd-trace-normalization" }
libdd-trace-stats = { version = "9.0.0", path = "../libdd-trace-stats", default-features = false, features = ["dogstatsd"] }
libdd-trace-utils = { version = "12.0.0", path = "../libdd-trace-utils", default-features = false }
libdd-trace-obfuscation = { version = "8.0.0", path = "../libdd-trace-obfuscation", default-features = false }
libdd-ddsketch = { version = "1.1.1", path = "../libdd-ddsketch" }
libdd-dogstatsd-client = { version = "6.0.0", path = "../libdd-dogstatsd-client", default-features = false, features = ["shared-runtime"] }
libdd-tinybytes = { version = "1.1.3", path = "../libdd-tinybytes", features = [
    "bytes_string",
    "serialization",
] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time", "test-util", "net"] }
libdd-capabilities-impl = { version = "5.0.0", path = "../libdd-capabilities-impl", default-features = false }
tonic.workspace = true
h2.workspace = true
prost = { workspace = true, features = ["std"] }
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rand.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
uuid = { workspace = true, features = ["js", "std"] }

[lib]
bench = false

[[example]]
name = "send-traces-agentless"

[[bench]]
name = "trace_buffer"
harness = false
path = "benches/trace_buffer.rs"

[dev-dependencies]
libdd-capabilities-impl = { version = "5.0.0", path = "../libdd-capabilities-impl" }
libdd-log = { path = "../libdd-log" }
libdd-shared-runtime = { version = "4.0.0", path = "../libdd-shared-runtime" }
regex = { workspace = true, features = ["std", "unicode", "perf"] }
clap = { workspace = true, default-features = true, features = ["derive"] }
criterion.workspace = true
libdd-trace-utils = { path = "../libdd-trace-utils", features = [
    "test-utils",
] }
httpmock.workspace = true
prost = { workspace = true, features = ["std"] }
rand = { workspace = true, default-features = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "test-util"] }
duplicate = { workspace = true, default-features = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
h2.workspace = true
zstd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
zrip = { workspace = true, features = ["alloc"] }

[[test]]
name = "test_agentless_stats"
required-features = ["stats-obfuscation"]

[[example]]
name = "send-traces-with-stats"
required-features = ["stats-obfuscation"]

[features]
default = ["https", "telemetry"]
telemetry = ["libdd-telemetry", "libdd-trace-stats/telemetry"]
https = [
    "libdd-common/https",
    "libdd-capabilities-impl/https",
    "libdd-shared-runtime/https",
    "libdd-telemetry?/https",
    "libdd-trace-stats/https",
    "libdd-trace-utils/https",
    "libdd-dogstatsd-client/https",
]
stats-obfuscation = [
    "libdd-trace-stats/stats-obfuscation"
]

fips = [
    "libdd-common/fips",
    "libdd-capabilities-impl/fips",
    "libdd-shared-runtime/fips",
    "libdd-telemetry?/fips",
    "libdd-trace-stats/fips",
    "libdd-trace-utils/fips",
    "libdd-dogstatsd-client/fips",
]
test-utils = []
regex-lite = ["libdd-common/regex-lite"]
# Enable zstd compression for the agentless trace and stats intake senders.
compression = [
    "libdd-trace-utils/compression",
    "libdd-trace-stats/compression",
    "libdd-data-pipeline-core/compression",
]
