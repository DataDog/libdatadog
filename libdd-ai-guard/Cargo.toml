[package]
name = "libdd-ai-guard"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-ai-guard"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-ai-guard"
description = "AI Guard RC x509 Magic Tunnel client, dispatch handler, and local policy evaluator (POC)"

[lib]
bench = false

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true, features = ["std"] }
fastrand = { workspace = true }
futures = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
libdd-shared-runtime = { path = "../libdd-shared-runtime" }
pbjson-types = { workspace = true }
rc-x509-client = { workspace = true, features = ["non-fips"] }
rc-x509-proto = { workspace = true }
rc-x509-roots = { workspace = true }
regex = { workspace = true, features = ["perf", "std"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
webpki-roots = { workspace = true }

[dev-dependencies]
rc-crypto = { workspace = true, features = ["non-fips"] }
rc-x509-test-client-harness = { workspace = true, features = ["non-fips"] }
rc-x509-test-helpers = { workspace = true, features = ["non-fips", "test-issuer"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
