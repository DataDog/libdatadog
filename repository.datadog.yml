---
# This file defines overrides for the merge queue configuration.
# See https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3121612126/MergeQueue#Configuration-Specification for defaults.
schema-version: v1
kind: mergequeue
merge_method: squash
# Each PR in the MQ will be rebased on the base branch before merging
# conflicts between PRs in the MQ will not be able to be detected
workflow_type: noqueue
gitlab_check_enable: true
# Do not auto-retry any failed GitLab jobs
gitlab_jobs_retry_enable: false
# Fail the MQ request as soon as any job fails
# Note: the MQ will honor any `retry: #` and `allow_failures: true` set on a job
gitlab_fail_fast: true
---
schema-version: v1
kind: mergegate
rules:
  - require: pull-request-freshness
    max_age: 10d
  - require: all-files-are-owned
  - require: commit-signatures
    excluded_emails:
      - '41898282+github-actions[bot]@users.noreply.github.com' # version-bump bots
---
schema-version: v2
kind: adms
auto-version-updates:
  disabled:
    reason: Auto-generated PRs fail to compile on Rust. Dependency updates must be deliberate. We already monitor dependabot for security updates.
