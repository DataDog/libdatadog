name: Validate Backport
on:
  pull_request:
    types:
      - labeled

jobs:
  validate-backport:
    name: Validate Backport
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: >
      github.event.action == 'labeled' && contains(github.event.label.name, 'backport')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Conflicts
        env:
          BACKPORT_LABEL: ${{ github.event.label.name }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: backport_validation
        run: |

          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if ! echo "${BACKPORT_LABEL}" | grep -Eq '^backport v[0-9]+\.[0-9]+$'; then
            echo "Label '${BACKPORT_LABEL}' does not match expected format 'backport v<N>.<M>' (for example 'backport v43.0')."
            exit 1
          fi

          # A 'backport v<N>.<M>' label targets the newest 'v<N>.<M>.*' branch (or an
          # exact 'v<N>.<M>' branch when it exists). Resolve it accordingly.
          LABEL_VERSION=$(echo "${BACKPORT_LABEL}" | sed 's/^backport //')
          TARGET_BRANCH=$(git ls-remote --heads origin "refs/heads/${LABEL_VERSION}" "refs/heads/${LABEL_VERSION}.*" \
            | awk '{ print $2 }' | sed 's|^refs/heads/||' | sort -V | tail -n 1)
          if [ -z "${TARGET_BRANCH}" ]; then
            echo "No branch found for label '${BACKPORT_LABEL}' (expected a '${LABEL_VERSION}' or '${LABEL_VERSION}.*' branch)."
            exit 1
          fi
          MERGE_COMMIT=$(git rev-parse HEAD)
          git checkout origin/${TARGET_BRANCH}
          echo "cherrypicking with capture"
          CHERRYPICK_OUT=$( { git cherry-pick -x --mainline 1 ${MERGE_COMMIT} 2>&1; echo $? > /tmp/cmd_status.txt; } ) || true
          CHERRYPICK_STATUS=$(< /tmp/cmd_status.txt)
          rm /tmp/cmd_status.txt
          echo "cherrypick status code: ${CHERRYPICK_STATUS}"

          echo "results<<EOF" >> "$GITHUB_OUTPUT"
          if [[ ${CHERRYPICK_STATUS} != "0" ]]
          then
            echo "This change is marked for backport to ${TARGET_BRANCH}, but it conflicts with that branch." | tee -a "$GITHUB_OUTPUT"
            echo "Attempting to cherrypick this change to ${TARGET_BRANCH} yielded the following error:" | tee -a "$GITHUB_OUTPUT"
            echo "\`\`\`" >> "$GITHUB_OUTPUT"
            echo "$CHERRYPICK_OUT" | grep -v '^hint' | tee -a "$GITHUB_OUTPUT"
            echo "\`\`\`" >> "$GITHUB_OUTPUT"
          else
            echo "This change is marked for backport to ${TARGET_BRANCH} and it does not conflict with that branch." | tee -a "$GITHUB_OUTPUT"
          fi
          echo "The command used to test backporting was" | tee -a "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "git fetch origin ${TARGET_BRANCH} && git checkout origin/${TARGET_BRANCH} && git checkout -b backport-${PR_NUMBER}-to-${TARGET_BRANCH} && git cherry-pick -x --mainline 1 ${MERGE_COMMIT}" | tee -a "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RESULTS: ${{ steps.backport_validation.outputs.results }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.RESULTS,
            });
