name: Miri test
on:
  pull_request:
    branches-ignore:
      - release
  push:
    branches:
      - main
      - mq-working-branch-*
  schedule:
    - cron: '0 6 * * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.set-crates.outputs.crates }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
      with:
        fetch-depth: 0
    - name: Get crates report
      id: changed-crates
      uses: ./.github/actions/crates-reporter
    - name: Set crates to run Miri on
      id: set-crates
      env:
        CHANGED_CRATES_STATUS: ${{ steps.changed-crates.outputs.status }}
        CHANGED_CRATES: ${{ steps.changed-crates.outputs.crates }}
        AFFECTED_CRATES: ${{ steps.changed-crates.outputs.affected_crates }}
      run: |
        if [[ "$CHANGED_CRATES_STATUS" == "success" ]]; then
          echo "This is a pull request event, running Miri on changed and affected crates"
          echo "Changed crates: $CHANGED_CRATES"
          echo "Affected crates: $AFFECTED_CRATES"

          # create a list of crates from the affected crates
          CRATES=$(echo "$AFFECTED_CRATES" | jq -r 'map("-p " + .) | join(" ")')
          [[ -z "$CRATES" || "$CRATES" == '""' ]] && CRATES=""
        else
          echo "This is a push event, running Miri on all crates"
          CRATES="--workspace"
        fi
        echo "Crates: $CRATES"
        echo "crates=$CRATES" >> $GITHUB_OUTPUT

  run-miri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        partition: [1, 2, 3, 4, 5]
    needs: setup
    if: ${{ needs.setup.outputs.crates != '' }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PROPTEST_CASES: 1
    steps:
      - name: Free Disk Space (Ubuntu only)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # 1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - name: Read nightly version from ci-toolchain.toml
        id: nightly-version
        run: echo "version=$(grep -Po '^nightly = "\K[^"]+' ci-toolchain.toml)" >> $GITHUB_OUTPUT
      - name: Set up Rust
        run: |
          set -e
          rustup set profile minimal
          rustup toolchain install ${{ steps.nightly-version.outputs.version }} --component miri
      - uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: nextest@0.9.96
      - name: Cache [rust]
        id: rust-cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # 2.8.1
        with:
          cache-targets: true # cache build artifacts
          cache-bin: true # cache the ~/.cargo/bin directory
          shared-key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: echo "rust-cache ${{ steps.rust-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
      - env:
          # Override rust-toolchain.toml so miri runs on the dated nightly
          # (miri is nightly-only) instead of the workspace MSRV.
          RUSTUP_TOOLCHAIN: ${{ steps.nightly-version.outputs.version }}
        # Which tests run is decided by `[profile.default-miri]` in
        # .config/nextest.toml, which nextest picks because no `--profile` is
        # given. Passing `--profile` here would drop that selection.
        run: |
          set -o pipefail
          MIRIFLAGS="-Zmiri-disable-isolation" cargo miri nextest run ${{ needs.setup.outputs.crates }} --partition count:${{ matrix.partition }}/5 --no-tests=pass 2>&1 | tee "$RUNNER_TEMP/miri.log"
      # We need to disable isolation because
      # "unsupported operation: `clock_gettime` with `REALTIME` clocks not available when isolation is enabled"
      # A broken selection fails silently (`--no-tests=pass`), so full-workspace
      # runs check that the profile filter was applied and still selects a
      # plausible number of tests. PR runs cover a subset of crates, where zero
      # selected tests is legitimate.
      - name: Check the Miri test selection
        if: ${{ needs.setup.outputs.crates == '--workspace' }}
        env:
          # Per partition; roughly half of what the partitions ran when set.
          MIN_TESTS: 80
        run: |
          line=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/miri.log" | grep -m1 -E '^\s*Starting [0-9]+ tests? across' || true)
          echo "$line"
          if ! grep -q 'via profile.default-miri.default-filter' <<<"$line"; then
            echo "::error::The default-miri test filter was not applied; Miri ran every test."
            exit 1
          fi
          count=$(awk '{print $2}' <<<"$line")
          if (( count < MIN_TESTS )); then
            echo "::error::Only $count tests selected for Miri in this partition (expected at least $MIN_TESTS)."
            exit 1
          fi
