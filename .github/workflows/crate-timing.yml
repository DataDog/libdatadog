name: 'Weekly crate timing'

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Temporary: validation for the PR introducing this workflow; remove before merging.
  pull_request:
    paths:
      - '.github/workflows/crate-timing.yml'
      - 'tools/Cargo.toml'
      - 'tools/src/**'

permissions:
  contents: read

concurrency:
  group: crate-timing
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  crate-timing:
    name: "Per-crate test & bench execution time"
    # The workspace build fills a default runner's disk (same pool as test.yml).
    runs-on:
      labels: ubuntu-latest-16-cores
      group: APM Larger Runners
    timeout-minutes: 150
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      # rustup auto-installs the version pinned in rust-toolchain.toml.
      - name: Install cargo nextest
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: nextest@0.9.96
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          cache: false
      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache
      - name: Measure per-crate test and bench times
        run: cargo run --quiet -p tools --bin crate_timing
      - name: Write job summary
        if: always()
        run: |
          if [[ -f target/crate-timing/results.md ]]; then
            cat target/crate-timing/results.md >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: crate-timing-${{ github.run_id }}
          path: target/crate-timing/
      - name: sccache statistics
        if: always() && steps.sccache.outputs.enabled == 'true'
        run: sccache --show-stats
