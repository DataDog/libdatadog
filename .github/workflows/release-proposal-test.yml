name: Release - Test a release proposal PR changes using dd-trace-rs
on:
  push:
    branches:
      - release-proposal/**
      - release-proposal-testing/**
  pull_request:
      branches:
        - release/**
        - release-testing/**

env:
  # dd-trace-rs tags to test the proposal against are resolved at run time: the newest tag of each
  # of the DD_TRACE_RS_LINES most recent release lines matching DD_TRACE_RS_TAG_PREFIX.
  DD_TRACE_RS_REPO: https://github.com/DataDog/dd-trace-rs
  DD_TRACE_RS_TAG_PREFIX: datadog-opentelemetry-v
  DD_TRACE_RS_LINES: 3

jobs:
  package-and-upload-crates:
    permissions:
      id-token: write # Enable OIDC
    runs-on: ubuntu-latest
    outputs:
      upload_artifact: ${{ steps.package-crates.outputs.upload_artifact }}
      dd_trace_rs_versions: ${{ steps.dd-trace-rs-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          fetch-depth: 0
          # Checkout PR head (not the synthetic merge commit) so version comparison matches the proposal branch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Exclude from Green CI
        env:
          DATADOG_SITE: datadoghq.com
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: ./scripts/exclude-from-green-ci.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      # origin/main is needed for merge-base on push; PR base SHA must be fetched for git show.
      - name: Fetch refs for version comparison
        run: |
          git fetch origin main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          fi

      # Compare [package] versions between PR base and head (or merge-base(main,HEAD) vs push on direct push).
      # Dependency-only manifest edits are ignored; excludes match the old cargo package --exclude list.
      - name: Package crates with version bumps vs comparison base
        id: package-crates
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GIT_VERSION_BASE="${{ github.event.pull_request.base.sha }}"
            export GIT_VERSION_BASE
            GIT_VERSION_HEAD="${{ github.event.pull_request.head.sha }}"
            export GIT_VERSION_HEAD
          else
            # Direct push: compare from fork point with main, not origin/main's current tip (main may have advanced).
            GIT_VERSION_BASE="$(git merge-base origin/main HEAD)"
            export GIT_VERSION_BASE
            GIT_VERSION_HEAD="${GITHUB_SHA}"
            export GIT_VERSION_HEAD
          fi
          
          echo "Comparing Cargo.toml package versions: GIT_VERSION_BASE=${GIT_VERSION_BASE} GIT_VERSION_HEAD=${GIT_VERSION_HEAD}"
          mapfile -t PACKAGES < <(./scripts/crates-to-package.sh)
          echo "Packages to run cargo package on (version bump only):"
          printf '%s\n' "${PACKAGES[@]}"
          PKG_ARGS=()
          for p in "${PACKAGES[@]}"; do
            PKG_ARGS+=(-p "$p")
          done
          if [ "${#PKG_ARGS[@]}" -eq 0 ]; then
            echo "upload_artifact=false" >> "$GITHUB_OUTPUT"
            echo "Skipping cargo package: no crates had a version bump vs the base ref (PKG_ARGS is empty)."
            exit 0
          fi
          # cargo 1.92+ required: earlier versions (incl. the workspace MSRV 1.87) fail to
          # resolve sibling crates by version requirement when those versions are not yet on
          # crates.io
          cargo +1.92.0 package "${PKG_ARGS[@]}" --all-features
          echo "upload_artifact=true" >> "$GITHUB_OUTPUT"

      # Resolve the dd-trace-rs versions to compile against instead of hardcoding a matrix that
      # goes stale. A "release line" is the SemVer-breaking component: MAJOR from 1.0.0 on, and
      # MAJOR.MINOR while MAJOR is 0 (a 0.x minor bump is breaking). We take the newest patch of
      # each of the DD_TRACE_RS_LINES most recent lines, newest line first.
      # Runs unconditionally (even when nothing was packaged) so the matrix expression downstream
      # never sees an empty string.
      - name: Resolve dd-trace-rs versions to test against
        id: dd-trace-rs-versions
        run: |
          set -euo pipefail
          PREFIX="${DD_TRACE_RS_TAG_PREFIX}"

          # --refs drops the peeled `^{}` entries annotated tags produce. Pre-release tags
          # (e.g. -alpha.1) are filtered out; the prefix is matched literally (index/substr,
          # not a regex) so a prefix with regex metacharacters would still work.
          VERSIONS=$(git ls-remote --tags --refs "$DD_TRACE_RS_REPO" "refs/tags/${PREFIX}*" \
            | awk -v ref_prefix="refs/tags/${PREFIX}" '
                index($2, ref_prefix) == 1 {
                  v = substr($2, length(ref_prefix) + 1)
                  if (v ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print v
                }' \
            | sort -V)

          if [ -z "$VERSIONS" ]; then
            echo "Error: no '${PREFIX}MAJOR.MINOR.PATCH' tags found in $DD_TRACE_RS_REPO." >&2
            exit 1
          fi

          # Newest version of each release line. Input is ascending, so the last write per key wins.
          declare -A LATEST_BY_LINE=()
          while read -r version; do
            IFS='.' read -r major minor _patch <<< "$version"
            if [ "$major" = "0" ]; then
              LATEST_BY_LINE["0.$minor"]="$version"
            else
              LATEST_BY_LINE["$major"]="$version"
            fi
          done <<< "$VERSIONS"

          TAGS=()
          while read -r line; do
            TAGS+=("${PREFIX}${LATEST_BY_LINE[$line]}")
          done < <(printf '%s\n' "${!LATEST_BY_LINE[@]}" | sort -Vr | head -n "$DD_TRACE_RS_LINES")

          MATRIX=$(printf '%s\n' "${TAGS[@]}" | jq -R . | jq -c -s .)
          echo "dd-trace-rs versions to test against: $MATRIX"
          echo "versions=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload crates
        if: steps.package-crates.outputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-proposal-test-crates
          path: |
            target/package/*.crate
          retention-days: 1

  compile-dd-trace-rs:
    permissions:
      id-token: write # Enable OIDC
    runs-on: ubuntu-latest
    needs: package-and-upload-crates
    if: needs.package-and-upload-crates.outputs.upload_artifact == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.package-and-upload-crates.outputs.dd_trace_rs_versions) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          fetch-depth: 0
          repository: DataDog/dd-trace-rs
          ref: ${{ matrix.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Download release data
        uses: actions/download-artifact@v4
        with:
          name: release-proposal-test-crates
          path: /tmp/release-proposal-test-crates

      - name: Compile dd-trace-rs
        run: |
          CRATES_DIR="/tmp/release-proposal-test-crates"
          TOML_FILE="$(realpath Cargo.toml)"
          
          # if CRATES_DIR ends with a slash, remove it
          if [[ "$CRATES_DIR" == */ ]]; then
            CRATES_DIR="${CRATES_DIR%/}"
          fi

          # Get libdd-* direct dependencies only from the root manifest package.
          LIBDD_DEPENDENCIES=$(cargo metadata --manifest-path "$TOML_FILE" --format-version=1 --no-deps | jq -c '[.packages[] | select(.name == "datadog-opentelemetry") | .dependencies[]?.name | select(startswith("libdd-"))] | unique')

          echo "LIBDD_DEPENDENCIES: $LIBDD_DEPENDENCIES"

          PATCH_ARGS=()

          # Unzip crates and build a patch expression for local path overrides.
          # patch all the crates to patch transitive dependencies
          for crate in "$CRATES_DIR"/*.crate; do
            tar -xzvf "$crate" -C "$CRATES_DIR" > /dev/null

            CRATE_PATH=$(echo "$crate" | sed 's/.*\///' | sed 's/\.crate//')
            CRATE_TOML_FILE="$CRATES_DIR/$CRATE_PATH/Cargo.toml"
            
            CRATE_NAME=$(cargo metadata --manifest-path "$CRATE_TOML_FILE" --format-version=1 --no-deps | jq -r '[.packages[].name][0]')
            
            echo "Patching crate: $CRATE_NAME"
            PATCH_ARGS+=("--config" "patch.crates-io.$CRATE_NAME.path=\"$CRATES_DIR/$CRATE_PATH\"")
          done

          echo "Build dd-trace-rs with patch args: ${PATCH_ARGS[*]}"
          
          cargo update "${PATCH_ARGS[@]}"

          echo "--------------------------------"
          echo "Cargo tree: "
          cargo tree -d -e normal --workspace --all-features "${PATCH_ARGS[@]}"
          echo ""

          echo "--------------------------------"
          echo "Duplicated dependencies: "
          cargo tree -d -e normal --workspace --all-features --prefix none "${PATCH_ARGS[@]}" | grep "libdd-" | grep -vF '(*)' | sort | uniq
          echo ""

          echo "--------------------------------"
          echo "Building workspace:"
          cargo build --release --workspace --all-features "${PATCH_ARGS[@]}"


