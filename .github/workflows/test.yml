name: Test
on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize']
    branches-ignore:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - release
  push:
    branches:
      - main
      - mq-working-branch-*
  schedule:
    - cron: '0 6 * * *'
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      packages-count: ${{ steps.set-packages.outputs.packages-count }}
      packages: ${{ steps.set-packages.outputs.packages }}
      crashtracker-feature: ${{ steps.set-packages.outputs.crashtracker-feature }}
      run-test-spawn: ${{ steps.set-packages.outputs.run-test-spawn }}
      native-archive-inputs-changed: ${{ steps.native-archive-inputs.outputs.changed }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
      with:
        fetch-depth: 0
    - name: Get crates report
      id: changed-crates
      uses: ./.github/actions/crates-reporter
    - name: Check the native archive's locked build inputs
      if: github.event_name == 'pull_request'
      id: native-archive-inputs
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
          Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/test.yml)
        if [[ -n "$changed" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Set unit test packages
      id: set-packages
      env:
        CHANGED_CRATES_STATUS: ${{ steps.changed-crates.outputs.status }}
        CHANGED_CRATES_COUNT: ${{ steps.changed-crates.outputs.crates_count }}
        AFFECTED_CRATES: ${{ steps.changed-crates.outputs.affected_crates }}
      run: |
        if [[ "$CHANGED_CRATES_STATUS" == "skipped" ]]; then
          COUNT="1"
          PACKAGES=""
          CRASHTRACKER_FEATURE="--features libdd-crashtracker/generate-unit-test-files"
          RUN_TEST_SPAWN="true"
        elif [[ "$CHANGED_CRATES_COUNT" == "0" ]]; then
          COUNT="0"
          PACKAGES=""
          CRASHTRACKER_FEATURE=""
          RUN_TEST_SPAWN="false"
        else
          COUNT=$(echo "$AFFECTED_CRATES" | jq 'length')
          PACKAGES=$(echo "$AFFECTED_CRATES" | jq -r 'map("-p " + .) | join(" ")')
          if echo "$AFFECTED_CRATES" | jq -e 'any(. == "libdd-crashtracker")' > /dev/null; then
            CRASHTRACKER_FEATURE="--features libdd-crashtracker/generate-unit-test-files"
          else
            CRASHTRACKER_FEATURE=""
          fi
          if echo "$AFFECTED_CRATES" | jq -e 'any(. == "test_spawn_from_lib")' > /dev/null; then
            RUN_TEST_SPAWN="true"
          else
            RUN_TEST_SPAWN="false"
          fi
        fi
        {
          echo "packages-count=$COUNT"
          echo "packages=$PACKAGES"
          echo "crashtracker-feature=$CRASHTRACKER_FEATURE"
          echo "run-test-spawn=$RUN_TEST_SPAWN"
        } >> $GITHUB_OUTPUT

  test:
    name: "cargo test #${{ matrix.platform }}"
    needs: setup
    if: needs.setup.outputs.packages-count != '0'
    # Ubuntu jobs run on the larger APM runner pool — the default GitHub-hosted
    # ubuntu-latest disk fills up partway through the workspace build.
    runs-on: ${{ (matrix.platform == 'ubuntu-latest' && fromJSON('{"labels":"ubuntu-latest-16-cores","group":"APM Larger Runners"}')) || matrix.platform }}
    permissions:
      checks: write
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PACKAGES: ${{ needs.setup.outputs.packages }}
      CRASHTRACKER_FEATURE: ${{ needs.setup.outputs.crashtracker-feature }}
      TRACING_CRATES: "libdd-data-pipeline libdd-trace-utils libdd-tracer-flare"
    strategy:
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-15]
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu only)
        if: runner.os == 'Linux' && matrix.platform == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # 1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - id: rust-version
        # rustup auto-installs the version pinned in rust-toolchain.toml on first invocation.
        # On Windows run happens in a PowerShell, so start bash explicitly.
        run: bash -c 'echo "version=$(rustc --version | cut -d" " -f2)" >> $GITHUB_OUTPUT'
      - name: Install cargo nextest
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: nextest@0.9.96
      - name: Install Go (macOS and Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          cache: false
      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache
      - name: "Remove nextest CI report"
        shell: bash
        run: rm -rf target/nextest/ci/junit.xml
      - name: Configure git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: "[${{ steps.rust-version.outputs.version}}] cargo build"
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]]; then
            cargo build --workspace --exclude builder --verbose
          else
            # word splitting on $PACKAGES is intentional
            # shellcheck disable=SC2086
            cargo build $PACKAGES --verbose
          fi
      - name: "[${{ steps.rust-version.outputs.version}}] check minimal native features"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]] || echo "$PACKAGES" | \
            grep -Eq "libdd-(common|dogstatsd-client|http-client|trace-utils)"; then
            cargo check -p libdd-dogstatsd-client --no-default-features
            cargo check -p libdd-http-client --no-default-features \
              --features hyper-backend
            cargo check -p libdd-trace-utils --no-default-features \
              --features mini_agent
            cargo check -p libdd-trace-utils --no-default-features \
              --features test-utils
          fi
      - name: "[${{ steps.rust-version.outputs.version}}] cargo check no_std (library-config)"
        if: runner.os == 'Linux' && (env.PACKAGES == '' || contains(env.PACKAGES, 'libdd-library-config'))
        shell: bash
        run: |
          cargo check -p libdd-library-config --no-default-features
          cargo check -p libdd-library-config-ffi --no-default-features --features standalone --profile panic-abort
      - name: "[${{ steps.rust-version.outputs.version}}] cargo nextest run no_std (libdd-common)"
        if: runner.os == 'Linux' && (env.PACKAGES == '' || contains(env.PACKAGES, 'libdd-common'))
        shell: bash
        run: |
          cargo nextest run -p libdd-common --no-default-features --profile ci --verbose
          cargo nextest run -p libdd-common --no-default-features --features alloc --profile ci --verbose
      - name: "[${{ steps.rust-version.outputs.version}}] cargo test (doc) and cargo nextest run"
        shell: bash
        # Run doc tests with cargo test and run tests with nextest and generate junit.xml
        run: |
          if [[ -z "$PACKAGES" ]]; then
            # shellcheck disable=SC2086
            cargo test --workspace $CRASHTRACKER_FEATURE --exclude builder --doc --verbose
            # shellcheck disable=SC2086
            cargo nextest run --workspace $CRASHTRACKER_FEATURE --profile ci --verbose --no-tests=pass -E '!test(tracing_integration_tests::)'
            cargo nextest run -p libdd-http-client --no-default-features --features hyper-backend,hyper-proxy,https --profile ci --verbose
            # Run the FFI crate alone, once per backend: feature unification above would otherwise
            # pick the backend for it (reqwest, via libdd-agent-client).
            cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,hyper-backend,https --profile ci --verbose
            cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,reqwest-backend,https --profile ci --verbose
            cargo nextest run -p libdd-otel-thread-ctx --no-default-features --features shared-context --profile ci --verbose --no-tests=pass
          else
            # shellcheck disable=SC2086
            cargo test $PACKAGES $CRASHTRACKER_FEATURE --doc --verbose
            # shellcheck disable=SC2086
            cargo nextest run $PACKAGES $CRASHTRACKER_FEATURE --profile ci --verbose --no-tests=pass -E '!test(tracing_integration_tests::)'
            if echo "$PACKAGES" | grep -q "libdd-http-client"; then
              cargo nextest run -p libdd-http-client --no-default-features --features hyper-backend,hyper-proxy,https --profile ci --verbose
              cargo nextest run -p libdd-http-client --no-default-features --features reqwest-backend,https --profile ci --verbose
            fi
            if echo "$PACKAGES" | grep -q "libdd-http-client-ffi"; then
              # Alone, once per backend, so that feature unification does not pick one for it.
              cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,hyper-backend,https --profile ci --verbose
              cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,reqwest-backend,https --profile ci --verbose
            fi
            if echo "$PACKAGES" | grep -q "libdd-http-client-ffi"; then
              # Alone, once per backend, so that feature unification does not pick one for it.
              cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,hyper-backend,https --profile ci --verbose
              cargo nextest run -p libdd-http-client-ffi --no-default-features --features cbindgen,catch_panic,reqwest-backend,https --profile ci --verbose
            fi
            if echo "$PACKAGES" | grep -q "libdd-otel-thread-ctx"; then
              # The `shared-context` ownership mode is mutually exclusive with the default
              # `owned-context` one, so its tests need their own run. The crate's functionality
              # (and tests) is Linux-only, so non-Linux runners find zero tests here.
              cargo nextest run -p libdd-otel-thread-ctx --no-default-features --features shared-context --profile ci --verbose --no-tests=pass
            fi
          fi
      - name: "[${{ steps.rust-version.outputs.version}}] CDN transport with each TLS provider"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]] || echo "$PACKAGES" | grep -Eq "libdd-(ffe|networking)"; then
            for provider in https fips; do
              # Isolate runtime features: unrelated workspace/dev dependencies
              # must not be what enables the CDN proxy connector.
              cargo tree -p libdd-ffe --no-default-features --features "cdn,$provider" \
                --edges normal,build --prefix none --format '{p} {f}' \
                | grep -E '^libdd-networking .*hyper-proxy'
              cargo nextest run -p libdd-ffe --no-default-features \
                --features "cdn,$provider" --profile ci --success-output never
            done
          fi
      - name: "[${{ steps.rust-version.outputs.version}}] cargo nextest run -p libdd-networking --no-default-features --features fips"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if echo "$PACKAGES" | grep -q "libdd-networking"; then
            cargo nextest run -p libdd-networking --no-default-features --features fips --profile ci --verbose
          fi
        env:
          RUST_BACKTRACE: full
      - name: "[${{ steps.rust-version.outputs.version}}] cargo nextest run --all-features"
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]]; then
            cargo nextest run --workspace --all-features --exclude test_spawn_from_lib --verbose --no-tests=pass -E '!test(tracing_integration_tests::)'
          else
            # shellcheck disable=SC2086
            cargo nextest run $PACKAGES --all-features --verbose --no-tests=pass -E '!test(tracing_integration_tests::) & !package(test_spawn_from_lib)'
          fi
        env:
          RUST_BACKTRACE: full
      - name: "[${{ steps.rust-version.outputs.version}}] Tracing integration tests"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]]; then
            # shellcheck disable=SC2086
            for crate in $TRACING_CRATES; do
              PACKAGES="$PACKAGES -p $crate"
            done
            cargo nextest run $PACKAGES --profile ci --test-threads=1 --verbose --no-tests=pass -E 'test(tracing_integration_tests::)'
          else
            TRACING_PACKAGES=""
            for crate in $TRACING_CRATES; do
              if echo "$PACKAGES" | grep -qw -- "-p $crate"; then
                TRACING_PACKAGES="$TRACING_PACKAGES -p $crate"
              fi
            done
            if [[ -z "$TRACING_PACKAGES" ]]; then
              echo "No tracing integration test crates found in PACKAGES, skipping."
            else
              # shellcheck disable=SC2086
              cargo nextest run $TRACING_PACKAGES --profile ci --test-threads=1 --verbose --no-tests=pass -E 'test(tracing_integration_tests::)'
            fi
          fi
        env:
          RUST_BACKTRACE: full
      - name: "[${{ steps.rust-version.outputs.version}}] RUSTFLAGS=\"-C prefer-dynamic\" cargo nextest run --package test_spawn_from_lib --features prefer-dynamic -E '!test(tracing_integration_tests::)'"
        shell: bash
        run: cargo nextest run --package test_spawn_from_lib --features prefer-dynamic -E '!test(tracing_integration_tests::)'
        env:
          RUSTFLAGS: "-C prefer-dynamic"
          RUST_BACKTRACE: full
      - name: Add file attributes to JUnit XML
        if: success() || failure()
        shell: bash
        run: cargo run --bin add_junit_file_attributes -- target/nextest/ci/junit.xml
      - name: Report Test Results
        if: success() || failure()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # 4.3.1
        with:
          report_paths: "target/nextest/ci/junit.xml"
          check_name: "[${{ matrix.platform }}:${{ steps.rust-version.outputs.version }}] test report"
          include_passed: true
      # Forked PRs get no id-token permission, so on failure the upload below
      # runs with an empty key and is itself continue-on-error.
      - name: Get Datadog credentials via dd-sts
        id: dd-sts
        if: success() || failure()
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: public-datadog-libdatadog
      - name: Upload test results to Datadog
        if: success() || failure()
        continue-on-error: true
        shell: bash
        run: |
          # Download datadog-ci binary
          if [ "${{ runner.os }}" == "Linux" ]; then
            URL="https://github.com/DataDog/datadog-ci/releases/download/v4.2.2/datadog-ci_linux-x64"
            OUTPUT="datadog-ci"
            CHECKSUM_CMD="sha256sum"
            EXPECTED_CHECKSUM="3e1e9649d15d3feacced89ec90de66151046a58c7844217e4112362ad8dbf8d1"
          elif [ "${{ runner.os }}" == "Windows" ]; then
            URL="https://github.com/DataDog/datadog-ci/releases/download/v4.2.2/datadog-ci_win-x64"
            OUTPUT="datadog-ci.exe"
            CHECKSUM_CMD="sha256sum"
            EXPECTED_CHECKSUM="13313279cb884fe098e2f80ca21d23e67b78a090a12e891e8e35be653ee2bbd0"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            URL="https://github.com/DataDog/datadog-ci/releases/download/v4.2.2/datadog-ci_darwin-x64"
            OUTPUT="datadog-ci"
            CHECKSUM_CMD="shasum -a 256"
            EXPECTED_CHECKSUM="071a6140b17438b3f9dd6c65da48b48ea03fc310034fa624ce874fdb6c325da4"
          fi

          echo "Downloading datadog-ci from $URL"
          curl -L --fail --retry 3 -o "$OUTPUT" "$URL"
          chmod +x "$OUTPUT"

          # Verify checksum
          ACTUAL_CHECKSUM=$($CHECKSUM_CMD "$OUTPUT" | cut -d' ' -f1)
          echo "Expected checksum: $EXPECTED_CHECKSUM"
          echo "Actual checksum: $ACTUAL_CHECKSUM"

          if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
            echo "Checksum verification failed!"
            exit 1
          fi
          echo "Checksum verification passed"

          # Upload test results
          ./"$OUTPUT" junit upload \
            --service libdatadog \
            --env ci \
            --logs \
            --tags rustc:${{ steps.rust-version.outputs.version }},arch:${{ runner.arch }},os:${{ runner.os }},platform:${{ matrix.platform }} \
            target/nextest/ci/junit.xml
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
      - name: sccache statistics
        if: always() && steps.sccache.outputs.enabled == 'true'
        shell: bash
        run: sccache --show-stats

  cross-centos7:
    name: Test x86_64-unknown-linux-gnu on centOS7 docker image
    needs: setup
    if: needs.setup.outputs.packages-count != '0'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      id-token: write
    env:
      PACKAGES: ${{ needs.setup.outputs.packages }}
      CRASHTRACKER_FEATURE: ${{ needs.setup.outputs.crashtracker-feature }}
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-cross-centos7
      cancel-in-progress: true
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # 1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache
      - name: Build CentOS 7 Docker image
        run: docker build -t libdatadog-centos7 -f tools/docker/Dockerfile.centos .
      - name: "cargo nextest run (centos7)"
        # Run docker as a user, not the default root
        # Mount and use the runner's toolchain as it's the same arch
        # exclude tracing integration tests since they require docker in docker to run a test-agent
        shell: bash
        run: |
          if [[ -z "$PACKAGES" ]]; then
            # shellcheck disable=SC2086
            NEXTEST_CMD="cargo nextest run --workspace $CRASHTRACKER_FEATURE --profile ci --no-tests=pass -E '!test(tracing_integration_tests::)'"
          else
            # shellcheck disable=SC2086
            NEXTEST_CMD="cargo nextest run $PACKAGES $CRASHTRACKER_FEATURE --profile ci --no-tests=pass -E '!test(tracing_integration_tests::)'"
          fi
          # sccache runs inside the container: mount the tool-cache binary
          # into the container PATH, forward the AWS session, and use the
          # container paths as basedirs.
          SCCACHE_ARGS=()
          if [[ -n "${SCCACHE_PATH:-}" && "${{ steps.sccache.outputs.enabled }}" == "true" ]]; then
            SCCACHE_ARGS+=(
              -v "${SCCACHE_PATH}:/usr/local/bin/sccache:ro"
              -e RUSTC_WRAPPER=sccache
              -e SCCACHE_BUCKET=dd-ci-artefacts-build-stable
              -e SCCACHE_REGION=us-east-1
              -e SCCACHE_S3_KEY_PREFIX=libddprof-build/sccache
              -e SCCACHE_S3_RW_MODE
              -e SCCACHE_SKIP_CACHE_CHECK
              -e SCCACHE_IGNORE_SERVER_IO_ERROR
              -e SCCACHE_BASEDIRS=/workspace:/usr/local/cargo
              -e AWS_ACCESS_KEY_ID
              -e AWS_SECRET_ACCESS_KEY
              -e AWS_SESSION_TOKEN
              -e AWS_REGION
            )
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${CARGO_HOME:-$HOME/.cargo}:/usr/local/cargo" \
            -v "${RUSTUP_HOME:-$HOME/.rustup}:/usr/local/rustup" \
            -e CARGO_HOME=/usr/local/cargo \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin:/opt/rh/devtoolset-11/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -w /workspace \
            "${SCCACHE_ARGS[@]}" \
            libdatadog-centos7 \
            sh -c "$NEXTEST_CMD && if command -v sccache >/dev/null 2>&1; then sccache --show-stats; fi"
      - name: Add file attributes to JUnit XML
        if: success() || failure()
        run: cargo run --bin add_junit_file_attributes -- target/nextest/ci/junit.xml
      - name: Report Test Results
        if: success() || failure()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # 4.3.1
        with:
          report_paths: "target/nextest/ci/junit.xml"
          check_name: "[centos7] test report"
          include_passed: true
      # Forked PRs get no id-token permission, so on failure the upload below
      # runs with an empty key and is itself continue-on-error.
      - name: Get Datadog credentials via dd-sts
        id: dd-sts
        if: success() || failure()
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: public-datadog-libdatadog
      - name: Upload test results to Datadog
        if: success() || failure()
        continue-on-error: true
        run: |
          URL="https://github.com/DataDog/datadog-ci/releases/download/v4.2.2/datadog-ci_linux-x64"
          OUTPUT="datadog-ci"
          EXPECTED_CHECKSUM="3e1e9649d15d3feacced89ec90de66151046a58c7844217e4112362ad8dbf8d1"

          echo "Downloading datadog-ci from $URL"
          curl -L --fail --retry 3 -o "$OUTPUT" "$URL"
          chmod +x "$OUTPUT"

          ACTUAL_CHECKSUM=$(sha256sum "$OUTPUT" | cut -d' ' -f1)
          echo "Expected checksum: $EXPECTED_CHECKSUM"
          echo "Actual checksum: $ACTUAL_CHECKSUM"

          if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
            echo "Checksum verification failed!"
            exit 1
          fi
          echo "Checksum verification passed"

          ./"$OUTPUT" junit upload \
            --service libdatadog \
            --env ci \
            --logs \
            --tags arch:${{ runner.arch }},os:Linux,platform:centos7 \
            target/nextest/ci/junit.xml
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}

  no-certs-exporter:
    name: "exporter_e2e tests (no CA certificates)"
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-no-certs-exporter
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - name: Cache [rust]
        # We do not use sccache for this job because S3 client builds a
        # reqwest client that requires a system CA store and panics when the
        # purged store is empty, so it cannot run inside the certificate-less
        # container. Mounting certs or setting SSL_CERT_FILE would defeat the
        # test's premise.
        id: rust-cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # 2.8.1
        with:
          cache-targets: true
          cache-bin: true
          shared-key: default
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: echo "rust-cache ${{ steps.rust-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # 3.10.0
      - name: Pre-fetch dependencies (requires network/certs on the runner)
        run: cargo fetch
      - name: Build no-certs Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tools/docker/Dockerfile.no-certs
          tags: libdatadog-no-certs
          load: true
          cache-from: type=gha,scope=no-certs-docker
          cache-to: type=gha,scope=no-certs-docker,mode=max
      - name: "cargo test exporter_e2e (no CA certificates)"
        # Mount the runner's Rust toolchain and cargo cache — no network needed inside.
        # The container has no CA certificates, reproducing minimal environments like
        # bare ubuntu:20.04. Regression test for 9a61cae82 which unconditionally loaded
        # the system cert store even for plain HTTP/unix endpoints.
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "${{ github.workspace }}:/workspace"
          -v "${CARGO_HOME:-$HOME/.cargo}:/usr/local/cargo"
          -v "${RUSTUP_HOME:-$HOME/.rustup}:/usr/local/rustup"
          -e CARGO_HOME=/usr/local/cargo
          -e RUSTUP_HOME=/usr/local/rustup
          -e PATH=/usr/local/cargo/bin:/usr/local/rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          -w /workspace
          libdatadog-no-certs
          cargo test -p libdd-profiling --test exporter_e2e

  native-remote-config:
    name: Native Remote Config archive (${{ matrix.target }})
    needs: setup
    if: >-
      needs.setup.outputs.native-archive-inputs-changed == 'true' ||
      (needs.setup.outputs.packages-count != '0' &&
      (needs.setup.outputs.packages == '' || contains(needs.setup.outputs.packages, '-p libdd-remote-config-wasm')))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
      RC_NATIVE_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            glibc-runtime: quay.io/centos/centos@sha256:e4ca2ed0202e76be184e75fb26d14bf974193579039d5573fb2348664deef76e
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            glibc-runtime: docker.io/arm64v8/centos@sha256:73f11afcbb50d8bc70eab9f0850b3fa30e61a419bc48cf426e63527d14a8373b
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            msvc-arch: amd64
          - runner: windows-2022
            target: i686-pc-windows-msvc
            msvc-arch: x86
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and test the native Remote Config archive on Unix
        if: runner.os != 'Windows' && !endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          bash libdd-remote-config-wasm/test/build-native-unix.sh "$RC_NATIVE_TARGET" "$RUNNER_TEMP" "$(git rev-parse HEAD)"
      - name: Test the extracted native Remote Config ABI on glibc 2.17
        if: endsWith(matrix.target, '-gnu')
        shell: bash
        env:
          RC_GLIBC_RUNTIME: ${{ matrix.glibc-runtime }}
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/remote-config-native-installed.moved:/installed:ro" \
            "$RC_GLIBC_RUNTIME" sh -ec '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              cd /installed
              sha256sum -c SHA256SUMS
              exec env -u LD_LIBRARY_PATH ./native-check'
      - name: Build the native Remote Config archive on Alpine
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          docker run --rm \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --volume "$RUNNER_TEMP:/output" --env CARGO_PROFILE_RELEASE_OPT_LEVEL \
            "docker.io/library/rust:$channel-alpine3.22" \
            sh -ec 'apk add --no-cache bash build-base git
              exec bash libdd-remote-config-wasm/test/build-native-unix.sh "$@"' \
            sh "$RC_NATIVE_TARGET" /output "$(git rev-parse HEAD)"
      - name: Test the extracted native Remote Config ABI on Alpine
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            --volume "$RUNNER_TEMP/remote-config-native-installed.moved:/installed:ro" \
            --env DD_RC_TEST_NATIVE=/installed/lib/liblibdd_remote_config_wasm.so \
            docker.io/library/node:26-alpine \
            sh -ec 'env -u LD_LIBRARY_PATH /installed/native-check
              exec env -u LD_LIBRARY_PATH node --test --test-name-pattern=native.FFI libdd-remote-config-wasm/test/abi.test.mjs'
      - name: Build and test the native Remote Config archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RC_MSVC_ARCH: ${{ matrix.msvc-arch }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch $env:RC_MSVC_ARCH -HostArch amd64 -SkipAutomaticLocation

          $target = $env:RC_NATIVE_TARGET
          $dll = 'libdd_remote_config_wasm.dll'
          $buildDir = "$env:RUNNER_TEMP/remote-config-native-build"
          $env:CARGO_TARGET_DIR = $buildDir
          rustup target add $target
          cargo build --locked --release -p libdd-remote-config-wasm --target $target
          $release = "$buildDir/$target/release"
          $headers = @(Get-ChildItem -LiteralPath "$release/build" -Recurse -File -Filter ddog_remote_config.h)
          if ($headers.Count -ne 1) { throw 'Expected one generated Remote Config header' }
          $stage = "$env:RUNNER_TEMP/remote-config-native-stage"
          $null = New-Item -ItemType Directory -Path "$stage/include", "$stage/lib"
          Copy-Item -LiteralPath $headers[0].FullName -Destination "$stage/include"
          Copy-Item -LiteralPath "$release/$dll", "$release/$dll.lib" -Destination "$stage/lib"
          Set-Content "$stage/SOURCE_COMMIT" -NoNewline -Value "$(git rev-parse HEAD)`n"
          Set-Content "$stage/TARGET" -NoNewline -Value "$target`n"

          $files = @("lib/$dll", "lib/$dll.lib", "include/ddog_remote_config.h", "SOURCE_COMMIT", "TARGET")
          function Get-ArchiveChecksums($Directory) {
            $checksums = foreach ($file in $files) {
              $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath "$Directory/$file").Hash.ToLowerInvariant()
              "$digest  $file"
            }
            ($checksums -join "`n") + "`n"
          }
          Set-Content "$stage/SHA256SUMS" -NoNewline -Value (Get-ArchiveChecksums $stage)
          $archive = "$env:RUNNER_TEMP/remote-config-native-$target.tar.gz"
          tar.exe -czf $archive -C $stage include lib SOURCE_COMMIT TARGET SHA256SUMS
          Move-Item $buildDir "$buildDir.parked"
          $installed = "$env:RUNNER_TEMP/remote-config-native-installed"
          $null = New-Item -ItemType Directory -Path $installed
          tar.exe -xzf $archive -C $installed
          if ((Get-ArchiveChecksums $installed) -cne (Get-Content "$installed/SHA256SUMS" -Raw)) {
            throw 'Remote Config archive checksums differ'
          }

          $source = (Resolve-Path 'libdd-remote-config-wasm/test/native.c').Path
          Push-Location $installed
          try {
            cl.exe /nologo /std:c11 /O2 /MT /W4 /WX /Iinclude $source "lib/$dll.lib" /Fe:native-check.exe
            Copy-Item -LiteralPath "lib/$dll" -Destination .
          } finally {
            Pop-Location
          }
          Move-Item $installed "$installed.moved"
          & "$installed.moved/native-check.exe"
          Add-Content $env:GITHUB_ENV -Value "DD_RC_TEST_NATIVE=$installed.moved/lib/$dll"
      - name: Install Node.js for native Remote Config conformance
        # Node.js 26 has no Windows x86 distribution.
        if: matrix.target != 'i686-pc-windows-msvc' && !endsWith(matrix.target, '-musl')
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '>=26.9.0 <27'
      - name: Test the extracted native Remote Config ABI
        if: matrix.target != 'i686-pc-windows-msvc' && !endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          : "${DD_RC_TEST_NATIVE:?Missing extracted Remote Config library}"
          node --test --test-name-pattern=native.FFI libdd-remote-config-wasm/test/abi.test.mjs
      - name: Upload the tested native Remote Config reactor
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: remote-config-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/remote-config-native-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  wasm:
    name: "WASM checks and tests"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-wasm
      cancel-in-progress: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache
      - name: Install wasm-bindgen test runner
        # Prebuilt binary: `cargo install` recompiles ~100 crates every run,
        # and the final link is never sccache-cacheable.
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: wasm-bindgen-cli@0.2.100
      - name: "cargo check -p libdd-data-pipeline --target wasm32-unknown-unknown --no-default-features"
        run: cargo check -p libdd-data-pipeline --target wasm32-unknown-unknown --no-default-features
        env:
          RUSTFLAGS: "-D warnings -A unused-imports -A dead-code -A unused-variables"
      - name: Run WASM tests
        run: cargo test -p libdd-wasm-tests --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: "cargo check -p libdd-remote-config --target wasm32-unknown-unknown --features client,agentless"
        run: cargo check -p libdd-remote-config --target wasm32-unknown-unknown --no-default-features --features client,agentless
        env:
          RUSTFLAGS: "-D warnings -A unused-imports -A dead-code -A unused-variables"
          # ring compiles C for wasm32, which the runner's default `cc` (gcc) cannot target.
          CC_wasm32_unknown_unknown: clang
      - name: Install Node.js for the Remote Config reactor tests
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - name: Build and test the Remote Config reactor
        run: |
          artifact_dir="$RUNNER_TEMP/remote-config-wasm"
          bash libdd-remote-config-wasm/test/build-wasi-bundle.sh "$artifact_dir"
          export DD_RC_TEST_WASM="$artifact_dir/libdd_remote_config_wasm.wasm"
          node --test libdd-remote-config-wasm/test/abi.test.mjs
      - name: Upload the tested Remote Config reactor
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: remote-config-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/remote-config-wasm/
          if-no-files-found: error
      - name: sccache statistics
        if: always() && steps.sccache.outputs.enabled == 'true'
        shell: bash
        run: sccache --show-stats
