name: Dispatch libdatadog release to libdatadog-rb

on: # yamllint disable-line rule:truthy
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Notify libdatadog-rb of a libdatadog release
    types:
      - completed

# The octo-sts mint for libdatadog-rb lives here, on the default branch, on
# purpose. notify-libdatadog-rb.yml (the tag-push trigger) executes from the
# tagged commit, so a mint there hands its token to whoever can push release
# tags. workflow_run resolves THIS workflow from the default branch, so the
# minting code is the reviewed definition from main, and the libdatadog-rb
# trust policy pins this file to refs/heads/main. The triggering run decides
# only that a push happened. This workflow's guards decide everything else,
# and only main's code can change them.

permissions: {}

jobs:
  dispatch:
    name: "Dispatch to DataDog/libdatadog-rb"
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      VERSION: ${{ github.event.workflow_run.head_branch }}
    steps:
      # The triggering run carries only the push event and the tag name. The
      # version comes from the tag ref itself, and its existence is checked
      # against the repository. Validate both before minting anything.
      - name: Validate version and tag
        id: check
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${VERSION} is not a plain release tag. Nothing to notify."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git ls-remote https://github.com/DataDog/libdatadog "refs/tags/${VERSION}")" ]; then
            echo "::error::Tag ${VERSION} does not exist."
            exit 1
          fi

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        if: steps.check.outputs.skip != 'true'
        uses: DataDog/dd-octo-sts-action@acaa02eee7e3bb0839e4272dacb37b8f3b58ba80 # v1.0.3
        with:
          scope: DataDog/libdatadog-rb
          policy: libdatadog.notify-libdatadog-rb

      - name: Dispatch to DataDog/libdatadog-rb
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh api "repos/DataDog/libdatadog-rb/dispatches" \
            -f event_type=libdatadog-released \
            -f "client_payload[version]=${VERSION#v}" \
            -f "client_payload[triggered_by]=${{ github.repository }}" \
            -f "client_payload[source_run_url]=${{ github.event.workflow_run.html_url }}"
