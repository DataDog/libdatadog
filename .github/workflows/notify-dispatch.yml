name: Dispatch libdatadog release to libdatadog-rb

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      version:
        description: Release tag name, for example v46.1.0
        required: true
        type: string

# The octo-sts mint for libdatadog-rb lives here, on the default branch, on
# purpose. Tag-push runs execute the workflow file from the tagged commit, so
# a mint inside a tag-triggered workflow hands its token to whoever can push
# release tags. notify-libdatadog-rb.yml (or a human) dispatches this
# workflow with --ref main, so the minting code is the reviewed
# definition from main, and the libdatadog-rb trust policy pins this file to
# refs/heads/main. Callers can pass a version string. Only main's code
# decides what happens with it.

permissions: {}

jobs:
  dispatch:
    name: "Dispatch to DataDog/libdatadog-rb"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # The caller may be anyone who can run this workflow. Validate the
      # version shape and the tag's existence before minting anything.
      - name: Validate version and tag
        id: check
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${VERSION} is not a plain release tag; nothing to notify."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git ls-remote https://github.com/DataDog/libdatadog "refs/tags/${VERSION}")" ]; then
            echo "::error::Tag ${VERSION} does not exist."
            exit 1
          fi

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        if: steps.check.outputs.skip != 'true'
        uses: DataDog/dd-octo-sts-action@acaa02eee7e3bb0839e4272dacb37b8f3b58ba80 # v1.0.3
        with:
          scope: DataDog/libdatadog-rb
          policy: libdatadog.notify-libdatadog-rb

      - name: Dispatch to DataDog/libdatadog-rb
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh api "repos/DataDog/libdatadog-rb/dispatches" \
            -f event_type=libdatadog-released \
            -f "client_payload[version]=${VERSION#v}" \
            -f "client_payload[triggered_by]=${{ github.repository }}" \
            -f "client_payload[source_run_url]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
