name: semver baseline cache
permissions:
  contents: read
on:
  push:
    branches: [main]

# Produces the semver baseline cache (scripts/semver-rustdoc.sh): rustdoc
# JSONs for every published crate at each main tip, plus sccache entries
# from compiling with the pinned stable. Not a required check: PRs against
# an uncovered tip regenerate what they need.
concurrency:
  group: semver-rustdoc-cache-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SEMVER_RUSTDOC_CACHE_DIR: ${{ github.workspace }}/.semver-rustdoc-cache
  SEMVER_RUSTDOC_S3_URI: s3://dd-ci-artefacts-build-stable/libddprof-build/semver-rustdoc
  SEMVER_RUSTDOC_CACHE_WRITE: 'true'

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # sccache and semver-cache write roles
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read stable version from ci-toolchain.toml
        id: stable-version
        run: echo "version=$(grep -Po '^stable = "\K[^"]+' ci-toolchain.toml)" >> $GITHUB_OUTPUT
      - name: Install Rust ${{ steps.stable-version.outputs.version }}
        run: |
          rustup set profile minimal
          rustup install ${{ steps.stable-version.outputs.version }} && rustup default ${{ steps.stable-version.outputs.version }}

      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache

      # Held after the sccache setup: the sccache server is already running
      # as a daemon with its own role and does not re-read the environment.
      - name: Configure AWS credentials (semver cache)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::486234852809:role/libdatadog-github-actions-semver-cache-write
          aws-region: us-east-1

      - name: Warm cache entries for this tip
        id: warm
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}
        run: |
          set -euo pipefail
          generated=$(./scripts/semver-rustdoc.sh warm .)
          echo "generated=$generated" >> "$GITHUB_OUTPUT"

      - name: Prune entries not live at this tip
        run: ./scripts/semver-rustdoc.sh prune HEAD
