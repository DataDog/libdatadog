name: Downstream impact

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - release

permissions:
  contents: read

jobs:
  detect:
    name: Detect potentially impacted repositories
    runs-on: ubuntu-latest
    outputs:
      has_impacted: ${{ steps.impact.outputs.has_impacted }}
      impacted_count: ${{ steps.impact.outputs.impacted_count }}
      matrix: ${{ steps.impact.outputs.matrix }}
      has_cargo_validations: ${{ steps.impact.outputs.has_cargo_validations }}
      cargo_validation_count: ${{ steps.impact.outputs.cargo_validation_count }}
      cargo_matrix: ${{ steps.impact.outputs.cargo_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate downstream impact detector
        run: python3 -m unittest scripts/tests/test_downstream_impact.py

      - name: Detect impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/downstream-impact.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --json-output downstream-impact.json \
            --markdown-output downstream-impact.md \
            --github-output "$GITHUB_OUTPUT"
          cat downstream-impact.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload impact report
        uses: actions/upload-artifact@v4
        with:
          name: downstream-impact
          path: |
            downstream-impact.json
            downstream-impact.md
          retention-days: 7

  validate-cargo-consumers:
    name: Validate ${{ matrix.repository }} (non-blocking)
    needs: detect
    if: needs.detect.outputs.has_cargo_validations == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.cargo_matrix) }}
    steps:
      - name: Checkout libdatadog PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: libdatadog
          persist-credentials: false

      - name: Checkout downstream repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          path: downstream
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0

      - name: Compile downstream repository with PR crates
        id: build
        continue-on-error: true
        env:
          LIBDATADOG_ROOT: ${{ github.workspace }}/libdatadog
          DOWNSTREAM_ROOT: ${{ github.workspace }}/downstream
          DOWNSTREAM_MANIFEST: ${{ matrix.manifest }}
          CARGO_ARGS_JSON: ${{ toJSON(matrix.cargo_args) }}
          PATCH_SOURCES_JSON: ${{ toJSON(matrix.patch_sources) }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          PATCH_CONFIG="$GITHUB_WORKSPACE/libdatadog-patches.toml"
          PACKAGES="$GITHUB_WORKSPACE/libdatadog-packages.tsv"

          cargo +1.92.0 metadata \
            --manifest-path "$LIBDATADOG_ROOT/Cargo.toml" \
            --format-version=1 \
            --no-deps \
            | jq -r '
                .packages[]
                | select(.source == null)
                | select(.publish == null or (.publish | type == "array" and length > 0))
                | [.name, .manifest_path]
                | @tsv
              ' > "$PACKAGES"

          : > "$PATCH_CONFIG"
          mapfile -t PATCH_SOURCES < <(jq -r '.[]' <<< "$PATCH_SOURCES_JSON")
          for source in "${PATCH_SOURCES[@]}"; do
            if [ "$source" = "crates-io" ]; then
              printf '[patch.crates-io]\n' >> "$PATCH_CONFIG"
            else
              printf '[patch."%s"]\n' "$source" >> "$PATCH_CONFIG"
            fi
            while IFS=$'\t' read -r crate manifest_path; do
              crate_path=$(dirname "$manifest_path")
              printf '"%s" = { path = "%s" }\n' \
                "$crate" "$crate_path" >> "$PATCH_CONFIG"
            done < "$PACKAGES"
            echo >> "$PATCH_CONFIG"
          done

          mapfile -t CARGO_ARGS < <(jq -r '.[]' <<< "$CARGO_ARGS_JSON")
          MANIFEST_PATH="$DOWNSTREAM_ROOT/$DOWNSTREAM_MANIFEST"
          LOG_PATH="$GITHUB_WORKSPACE/$ARTIFACT_NAME-validation.log"

          cd "$DOWNSTREAM_ROOT"
          cargo +1.92.0 update \
            --manifest-path "$MANIFEST_PATH" \
            --config "$PATCH_CONFIG"
          cargo +1.92.0 check \
            --manifest-path "$MANIFEST_PATH" \
            --config "$PATCH_CONFIG" \
            "${CARGO_ARGS[@]}" \
            2>&1 | tee "$LOG_PATH"

      - name: Report downstream compatibility
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOWNSTREAM_REPOSITORY: ${{ matrix.repository }}
          IMPACTED_COMPONENTS: ${{ matrix.components }}
        run: |
          {
            echo "## $DOWNSTREAM_REPOSITORY compatibility"
            echo
            echo "Components: $IMPACTED_COMPONENTS"
            echo
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "✅ **Compatible:** the repository compiles with the libdatadog crates from this PR."
            else
              echo "❌ **Failed (non-blocking):** the repository did not compile with the libdatadog crates from this PR."
              echo
              echo "See the build step and uploaded log for details."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload downstream validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-validation
          path: ${{ matrix.artifact_name }}-validation.log
          if-no-files-found: ignore
          retention-days: 7
