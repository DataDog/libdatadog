name: semver-check
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize', 'labeled', 'unlabeled']
    branches-ignore:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - release

concurrency:
  # Only pushes cancel in flight: an 'edited' run must not kill the
  # predecessor that writes the cache it reads.
  group: ci-${{ github.ref }}-semver
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  SEMVER_RUSTDOC_CACHE_DIR: ${{ github.workspace }}/.semver-rustdoc-cache
  SEMVER_RUSTDOC_S3_URI: s3://dd-ci-artefacts-build-stable/libddprof-build/semver-rustdoc

jobs:
  # Automation that opens a PR and labels it in two steps (`gh pr create
  # --label` is not atomic) produces an `opened` event whose payload carries no
  # labels, so a payload-based `if:` guard runs the check anyway. The later
  # `labeled` runs skip correctly, but the failed check run from the `opened` run
  # has a higher id and is the one all-checks keeps, so the PR stays red despite
  # the label.
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      - name: Check for skip-pr-title-semver-check label
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name'); then
            echo "ERROR: could not read labels for PR #${PR_NUMBER}." >&2
            exit 1
          fi

          if grep -qx 'skip-pr-title-semver-check' <<< "$LABELS"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Label skip-pr-title-semver-check is set; skipping semver checks."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Label skip-pr-title-semver-check is not set; running semver checks."
          fi

  detect-changes:
    needs: check-skip
    if: ${{ needs.check-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed_crates: ${{ steps.detect.outputs.crates }}
      has_rust_changes: ${{ steps.detect.outputs.has_changes }}
      stable_toolchain_changed: ${{ steps.toolchain.outputs.changed }}
      semver_pipeline_changed: ${{ steps.pipeline.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect ci-toolchain.toml change
        id: toolchain
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qx 'ci-toolchain.toml'; then
            echo "ci-toolchain.toml changed; semver tools will be smoke-tested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect semver pipeline change
        # A tool pin bump or a pipeline script edit breaks the same path a
        # toolchain bump does, and such a PR changes no crate, so the heavy
        # job would otherwise never run the smoke test that catches it.
        id: pipeline
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qxE '(\.github/workflows/pr-title-semver-check\.yml|scripts/semver-level\.sh|scripts/semver-rustdoc\.sh)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed published crates
        id: detect
        run: |
          set -euo pipefail

          # Get the base branch
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"

          # Find all changed files
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)

          MANIFEST_AFFECTED=$(./scripts/semver-level.sh --list-affected "$BASE_REF")
          echo "Crates whose manifest facts moved: ${MANIFEST_AFFECTED:-<none>}"

          # Get workspace members metadata using cargo-metadata
          # Filter to only workspace members that are publishable (publish != false and publish != [])
          # Extract workspace root and convert manifest paths to relative paths
          WORKSPACE_ROOT=$(cargo metadata --format-version=1 --no-deps | jq -r '.workspace_root')
          WORKSPACE_CRATES=$(cargo metadata --format-version=1 --no-deps | jq -c --arg root "$WORKSPACE_ROOT" '
            .packages[] |
            select(.source == null) |
            select(.publish == null or (.publish | type == "array" and length > 0)) |
            {name: .name, manifest_path: .manifest_path, relative_path: (.manifest_path | sub($root + "/"; ""))}
          ')

          # Array to store changed published crates
          CHANGED_CRATES=()

          # Check each published crate for changes
          while IFS= read -r crate_info; do
            CRATE_NAME=$(echo "$crate_info" | jq -r '.name')
            RELATIVE_PATH=$(echo "$crate_info" | jq -r '.relative_path')
            CRATE_DIR=$(dirname "$RELATIVE_PATH")

            # The pipeline reads the lib target's rustdoc and the manifest
            # facts; tests, benches, examples and prose cannot move its
            # verdict. Everything else still counts, including non-.rs
            # build inputs (e.g. libdd-trace-semantics' root mappings.json).
            if echo "$CHANGED_FILES" \
              | grep -vE "^${CRATE_DIR}/(tests|benches|examples|docs)/" \
              | grep -vE "^${CRATE_DIR}/(README|CHANGELOG|LICENSE|NOTICE)[^/]*$" \
              | grep -vE "^${CRATE_DIR}/[^/]+\.md$" \
              | grep -q "^${CRATE_DIR}/"; then
              echo "Detected change in published crate: $CRATE_NAME ($CRATE_DIR)"
              CHANGED_CRATES+=("$CRATE_NAME")
            elif grep -qxF "$CRATE_NAME" <<< "$MANIFEST_AFFECTED"; then
              echo "Detected manifest change reaching published crate: $CRATE_NAME (no file of its own changed)"
              CHANGED_CRATES+=("$CRATE_NAME")
            fi
          done < <(echo "$WORKSPACE_CRATES")

          # Output results
          if [[ ${#CHANGED_CRATES[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "crates=" >> "$GITHUB_OUTPUT"
            echo "No published crates changed in this PR"
          else
            CRATES_JSON=$(printf '%s\n' "${CHANGED_CRATES[@]}" | jq -R . | jq -s -c .)
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "crates=$CRATES_JSON" >> "$GITHUB_OUTPUT"
            echo "Changed published crates: ${CHANGED_CRATES[*]}"
          fi

  semver-check:
    needs: [check-skip, detect-changes]
    # A base retarget (github.event.changes.base set) re-runs the job;
    # title/body edits and reopens skip it and validate uses the cache.
    if: ${{ needs.check-skip.outputs.skip != 'true' && (needs.detect-changes.outputs.has_rust_changes == 'true' || needs.detect-changes.outputs.stable_toolchain_changed == 'true' || needs.detect-changes.outputs.semver_pipeline_changed == 'true') && github.event.action != 'reopened' && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      result_json: ${{ steps.semver.outputs.result_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read stable version from ci-toolchain.toml
        id: stable-version
        run: echo "version=$(grep -Po '^stable = "\K[^"]+' ci-toolchain.toml)" >> $GITHUB_OUTPUT
      - name: Read nightly version from ci-toolchain.toml
        id: nightly-version
        run: echo "version=$(grep -Po '^nightly = "\K[^"]+' ci-toolchain.toml)" >> $GITHUB_OUTPUT
      - name: Install Rust ${{ steps.stable-version.outputs.version }}
        run: |
          rustup set profile minimal
          rustup install ${{ steps.stable-version.outputs.version }} && rustup default ${{ steps.stable-version.outputs.version }}
          rustup toolchain install ${{ steps.nightly-version.outputs.version }}
          # Link the dated nightly as 'nightly' for tools (like cargo-public-api) that expect it
          ln -sf ~/.rustup/toolchains/${{ steps.nightly-version.outputs.version }}-x86_64-unknown-linux-gnu ~/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu

      - name: sccache
        # Compiles with the pinned stable, which the main-side warm job
        # writes sccache entries for.
        id: sccache
        uses: ./.github/actions/setup-sccache

      # Held after the sccache setup: the sccache server is already running
      # as a daemon with its own role and does not re-read the environment.
      - name: Configure AWS credentials (semver cache)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::486234852809:role/libdatadog-github-actions-semver-cache-read
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y libssl-dev  # cargo-public-api dependency

      - name: Install cargo-public-api
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: cargo-public-api@0.52.0, cargo-semver-checks@0.51.0
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}

      - name: Smoke-test the semver pipeline on the ci-toolchain.toml toolchain
        # A stable bump can move rustdoc's JSON format past what the pinned
        # tools parse. Run the exact pipeline path — generate both JSON
        # flavors, hand them to both tools — with baseline and current
        # identical, so any failure is tooling, never a real violation.
        if: ${{ needs.detect-changes.outputs.stable_toolchain_changed == 'true' || needs.detect-changes.outputs.semver_pipeline_changed == 'true' }}
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}
          PROBE_CRATE: libdd-ddsketch
        run: |
          set -uo pipefail
          FAILED=()
          SMOKE=$(mktemp -d)
          if ! ./scripts/semver-rustdoc.sh generate "$PROBE_CRATE" semver . "$SMOKE/b.semver.json" \
             || ! ./scripts/semver-rustdoc.sh generate "$PROBE_CRATE" public . "$SMOKE/b.public.json"; then
            FAILED+=("rustdoc-json-generation")
          fi
          if ! cargo semver-checks check-release -p "$PROBE_CRATE" \
                --current-rustdoc "$SMOKE/b.semver.json" --baseline-rustdoc "$SMOKE/b.semver.json"; then
            FAILED+=("cargo-semver-checks")
          fi
          if ! cargo public-api --color=never diff "$SMOKE/b.public.json" "$SMOKE/b.public.json" > /dev/null; then
            FAILED+=("cargo-public-api")
          fi
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error title=Semver pipeline smoke test failed::${FAILED[*]} failed on Rust $RUSTUP_TOOLCHAIN (crate $PROBE_CRATE). A stable bump likely emits a rustdoc JSON format a pinned tool does not parse; a tool-pin bump or a pipeline-script change may have broken the handoff. Bump the tool versions (install-action step) or revert the change."
            exit 1
          fi
          echo "✅ semver pipeline (prebuilt rustdoc JSON) runs on Rust $RUSTUP_TOOLCHAIN"

      - name: Run semver checks on changed crates
        id: semver
        if: ${{ needs.detect-changes.outputs.has_rust_changes == 'true' }}
        env:
          # Override rust-toolchain.toml so the tools run on the pinned stable
          # from ci-toolchain.toml, not the workspace MSRV.
          RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}
        run: |
          set -euo pipefail

          CHANGED_CRATES='${{ needs.detect-changes.outputs.changed_crates }}'
          BASELINE="$GITHUB_BASE_REF"
          HIGHEST_LEVEL=""

          # Parse JSON array
          readarray -t CRATES < <(echo "$CHANGED_CRATES" | jq -r '.[]')

          CRATES_JSON="[]"
          for CRATE_NAME in "${CRATES[@]}"; do
            # Run the semver-level.sh script and capture the crate changes
            CRATE=$(./scripts/semver-level.sh "$CRATE_NAME" "$BASELINE")
            LEVEL=$(echo "$CRATE" | jq -r '.level')

            if [[ "$LEVEL" == "major" ]]; then
              HIGHEST_LEVEL="major"
            elif [[ "$LEVEL" == "minor" && ( -z "$HIGHEST_LEVEL" || "$HIGHEST_LEVEL" == "patch" ) ]]; then
              HIGHEST_LEVEL="minor"
            elif [[ "$LEVEL" == "patch" && -z "$HIGHEST_LEVEL" ]]; then
              HIGHEST_LEVEL="patch"
            elif [[ "$LEVEL" != "major" && "$LEVEL" != "minor" && "$LEVEL" != "patch" ]]; then
              echo "Error: unknown level ($LEVEL)"
              exit 1
            fi

            CRATES_JSON=$(echo "$CRATES_JSON" | jq --argjson crate "$CRATE" '. += [$crate]')
          done


          RESULT_JSON=$(jq -n \
          --arg highest_level "$HIGHEST_LEVEL" \
          --argjson crates "$CRATES_JSON" \
          '{highest_level: $highest_level, crates: $crates}')

          # Save JSON result to GITHUB_OUTPUT using multiline format
          {
            echo "result_json<<EOF"
            echo "$RESULT_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          printf '%s' "$RESULT_JSON" > semver-result.json

      - name: Persist semver result for title-only revalidation
        if: steps.semver.outcome == 'success'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # 4.2.2
        with:
          path: semver-result.json
          key: semver-result-${{ github.event.pull_request.head.sha }}

  validate:
    needs: [check-skip, detect-changes, semver-check]
    if: ${{ always() && needs.check-skip.outputs.skip != 'true' && needs.detect-changes.outputs.has_rust_changes == 'true' && (needs.semver-check.result == 'success' || needs.semver-check.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore semver result (title-only revalidation)
        if: needs.semver-check.result == 'skipped'
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # 4.2.2
        with:
          path: semver-result.json
          key: semver-result-${{ github.event.pull_request.head.sha }}

      - name: Select semver result
        env:
          SEMVER_RESULT_FROM_JOB: ${{ needs.semver-check.outputs.result_json }}
        run: |
          set -euo pipefail
          if [[ -n "$SEMVER_RESULT_FROM_JOB" ]]; then
            printf '%s' "$SEMVER_RESULT_FROM_JOB" > semver-result.json
          elif [[ -s semver-result.json ]]; then
            echo "semver-check skipped for this event; validating against the result cached for this head SHA."
          else
            echo "::error::No semver result for this head SHA: semver-check was skipped and no cached result exists. Re-run the semver-check workflow from the PR's Actions page, or push a commit."
            exit 1
          fi
          {
            echo "SEMVER_RESULT_JSON<<EOF"
            cat semver-result.json
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Validate PR title against semver changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Parse JSON output to extract semver level and crates
          SEMVER_LEVEL=$(echo "$SEMVER_RESULT_JSON" | jq -r '.highest_level')
          CRATES_CHECKED=$(echo "$SEMVER_RESULT_JSON" | jq -r '.crates | map("\(.name):\(.level)") | join(" ")')

          echo "PR Title: $PR_TITLE"
          echo "Detected semver level: $SEMVER_LEVEL"
          echo "Crates with changes: $CRATES_CHECKED"

          # Format: type(optional-scope): description
          # Breaking changes: type!: or type(scope)!: or BREAKING CHANGE: footer in body
          REGEX='^([a-z]+)(\([^)]+\))?(!)?: .+'
          if [[ "$PR_TITLE" =~ $REGEX ]]; then
            TYPE="${BASH_REMATCH[1]}"
            HAS_BREAKING_MARKER="${BASH_REMATCH[3]}"
          else
            echo "ERROR: Could not parse type from: $PR_TITLE"
            exit 1
          fi

          # Check for BREAKING CHANGE: or BREAKING-CHANGE: in PR body
          HAS_BREAKING_FOOTER=""
          if echo "$PR_BODY" | grep -qE '^BREAKING[- ]CHANGE:'; then
            HAS_BREAKING_FOOTER="true"
          fi

          # Consider it a breaking change if either marker is present
          IS_BREAKING_CHANGE=""
          if [[ -n "$HAS_BREAKING_MARKER" ]] || [[ -n "$HAS_BREAKING_FOOTER" ]]; then
            IS_BREAKING_CHANGE="true"
          fi

          echo ""
          echo "Detected PR title type: $TYPE"
          echo "Breaking marker (!) present: ${HAS_BREAKING_MARKER:-no}"
          echo "Breaking footer present: ${HAS_BREAKING_FOOTER:-no}"
          echo "Is breaking change: ${IS_BREAKING_CHANGE:-no}"
          echo ""

          VALIDATION_FAILED="false"
          FAILURE_REASONS=()

          # Rule: ci/docs/style/test cannot change what a consumer sees
          #
          # 'build' is deliberately NOT in this list. Conventional Commits defines it as
          # changes to the build system *or external dependencies*, and semver-level.sh
          # scores a raised dependency floor as a minor
          case "$TYPE" in
            ci|docs|style|test)
              if [[ "$SEMVER_LEVEL" == "major" ]] || [[ "$SEMVER_LEVEL" == "minor" ]]; then
                VALIDATION_FAILED="true"
                FAILURE_REASONS+=("'$TYPE' cannot change the public API, a dependency requirement floor, or the cargo feature surface. Use a different PR type ('build' for a dependency change), or leave those alone.")
              fi
              ;;
            feat|fix|refactor|chore|perf|revert|build)
              # These can be any semver level (subject to breaking change rules below)
              ;;
            *)
              VALIDATION_FAILED="true"
              FAILURE_REASONS+=("Unknown PR type: '$TYPE'. Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert")
              ;;
          esac

          # Rule: major API changes must have a breaking change marker
          if [[ "$SEMVER_LEVEL" == "major" ]] && [[ -z "$IS_BREAKING_CHANGE" ]]; then
            VALIDATION_FAILED="true"
            FAILURE_REASONS+=("Major API changes require a breaking change marker. Add '!' to PR title (e.g. 'feat!:' or 'feat(scope)!:') or add 'BREAKING CHANGE:' footer in PR body.")
          fi

          if [[ "$VALIDATION_FAILED" == "true" ]]; then
            echo ""
            echo "============================================"
            echo "❌ SEMVER VALIDATION FAILED"
            echo "============================================"
            echo ""
            echo "PR Title: $PR_TITLE"
            echo "PR Type: $TYPE"
            echo "Detected semver level: $SEMVER_LEVEL"
            echo "Breaking change marked: ${IS_BREAKING_CHANGE:-no}"
            echo ""
            echo "--------------------------------------------"
            echo "WHAT WAS DETECTED:"
            echo "--------------------------------------------"
            echo "$SEMVER_RESULT_JSON" | jq -r '.crates[] | "Crate: \(.name)\n  Level: \(.level)\n  Reason: \(.reason)\n  Details:\n\(.details | split("\n") | map("    " + .) | join("\n"))\n"'
            echo ""
            echo "--------------------------------------------"
            echo "WHY THIS FAILED:"
            echo "--------------------------------------------"
            for reason in "${FAILURE_REASONS[@]}"; do
              echo "- $reason"
            done
            echo ""
            echo "--------------------------------------------"
            echo "VALID COMBINATIONS:"
            echo "--------------------------------------------"
            echo "  ci/docs/style/test -> patch or none only (no change to the public API,"
            echo "                        a dependency requirement floor, or the feature surface)"
            echo "  all other types    -> any level allowed ('build' included: it is the"
            echo "                        conventional type for a dependency change)"
            echo "  major changes      -> must have '!' or 'BREAKING CHANGE:' footer"
            echo ""
            exit 1
          else
            echo "✅ Semver validation passed: '$TYPE' is compatible with '$SEMVER_LEVEL'"
            exit 0
          fi
