name: Notify libdatadog-rb of a libdatadog release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

# The plain `v<major>.<minor>.<patch>` tags are the libdatadog crate release
# interface (libdd-* crates use prefixed tags like `libdd-telemetry-v10.0.0`),
# and libdatadog-rb builds from the git tag -- the crate is not published to
# crates.io -- so a tag push is the first moment downstreams can consume a
# release. Hotfix releases are tagged on maintenance branches (v46.x is the
# current one) before reaching main, so only this trigger catches every
# release flow.
#
# This workflow runs from the TAGGED COMMIT, which makes it untrusted by
# design: whoever can push a release tag controls this file's contents. It
# therefore holds no secrets and mints no tokens. Its only power is to
# trigger notify-dispatch.yml from main, where the octo-sts mint lives. See
# that workflow for the trust chain.

permissions: {}

jobs:
  notify-libdatadog-rb:
    name: "Notify DataDog/libdatadog-rb"
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger notify-dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          # The tag filter above is a loose glob; skip shapes that are not
          # plain releases before spending a second workflow run on them.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${VERSION} is not a plain release tag; nothing to notify."
            exit 0
          fi
          gh workflow run notify-dispatch.yml --ref main -f version="$VERSION"
