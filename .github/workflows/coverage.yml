name: Coverage

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.coverage-scope.outputs.mode }}
      packages: ${{ steps.coverage-scope.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          fetch-depth: 0
      - name: Get crates report
        id: changed-crates
        uses: ./.github/actions/crates-reporter
      - name: Set coverage scope
        id: coverage-scope
        env:
          CHANGED_CRATES_STATUS: ${{ steps.changed-crates.outputs.status }}
          AFFECTED_CRATES: ${{ steps.changed-crates.outputs.affected_crates }}
        run: |
          if [[ "$CHANGED_CRATES_STATUS" == "success" ]]; then
            COUNT=$(echo "$AFFECTED_CRATES" | jq 'length')
            if [[ "$COUNT" == "0" ]]; then
              MODE="skip"
              PACKAGES=""
            else
              MODE="crates"
              PACKAGES=$(echo "$AFFECTED_CRATES" | jq -r 'map("-p " + .) | join(" ")')
            fi
          else
            # Push, schedule, the run-all-tests label, or a reporter failure:
            # cover everything so the baseline stays complete.
            MODE="workspace"
            PACKAGES=""
          fi
          {
            echo "mode=$MODE"
            echo "packages=$PACKAGES"
          } >> "$GITHUB_OUTPUT"

  coverage:
    needs: setup
    if: needs.setup.outputs.mode != 'skip'
    runs-on:
      labels: ubuntu-latest-16-cores
      group: APM Larger Runners
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          submodules: recursive
      - name: Read nightly version from nightly-toolchain.toml
        id: nightly-version
        run: echo "version=$(grep -Po '^channel = "\K[^"]+' nightly-toolchain.toml)" >> $GITHUB_OUTPUT
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup install ${{ steps.nightly-version.outputs.version }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2c41309d51ede152b6f2ee6bf3b71e6dc9a8b7df # 2.49.27
        with:
          tool: cargo-llvm-cov@0.6.13,nextest@0.9.96
      - name: sccache
        id: sccache
        uses: ./.github/actions/setup-sccache
      - name: Generate code coverage (including doc tests)
        env:
          # Override rust-toolchain.toml so cargo-llvm-cov runs on the dated
          # nightly (doc-test coverage needs nightly) instead of the workspace MSRV.
          RUSTUP_TOOLCHAIN: ${{ steps.nightly-version.outputs.version }}
          MODE: ${{ needs.setup.outputs.mode }}
          PACKAGES: ${{ needs.setup.outputs.packages }}
        run: |
          if [[ "$MODE" == "crates" ]]; then
            # Word splitting on $PACKAGES is intentional: one -p flag per crate.
            # shellcheck disable=SC2086
            cargo llvm-cov --all-features --no-report nextest $PACKAGES --no-tests=pass
            # shellcheck disable=SC2086
            cargo llvm-cov --all-features --no-report --doc $PACKAGES
          else
            cargo llvm-cov --all-features --workspace --no-report nextest --no-tests=pass
            cargo llvm-cov --all-features --workspace --no-report --doc
          fi
          # One lcov file per crate, in both modes, so pull requests and the
          # main baseline are always split the same way. A single report pass;
          # split_lcov.sh explains why not one `--package` report per crate.
          cargo llvm-cov report --doctests --lcov --output-path /tmp/lcov-all.info
          ./scripts/split_lcov.sh /tmp/lcov-all.info .
      # Forked PRs get no id-token permission, so on failure the upload below
      # runs with an empty key and is itself continue-on-error.
      - name: Get Datadog credentials via dd-sts
        id: dd-sts
        if: always()
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: public-datadog-libdatadog
      - name: Upload coverage to Datadog
        if: always()
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d2cf302a39c05e0ad22063360a2bf6ce0cc4906c # v1
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: lcov-*.info
          format: lcov
      - name: sccache statistics
        if: always() && steps.sccache.outputs.enabled == 'true'
        shell: bash
        run: sccache --show-stats
