name: cargo-deny bans
# Dedicated, always-on security gate: banned/compromised crates must never enter
# the dependency graph. Kept separate from "Metadata, docs and deps" (which is
# suppressed for release/version target branches via branches-ignore)
on:
  pull_request:
  push:
    branches:
      - 'mq-working-branch-*'
      - 'release/*'
permissions:
  contents: read
jobs:
  cargo-deny-bans:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
    - name: Read stable version from ci-toolchain.toml
      id: stable-version
      run: echo "version=$(grep -Po '^stable = "\K[^"]+' ci-toolchain.toml)" >> $GITHUB_OUTPUT
    # No rust cache: cargo-deny never compiles, it only reads cargo metadata.
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c #stable
      with:
        toolchain: ${{ steps.stable-version.outputs.version }}
    - uses: taiki-e/cache-cargo-install-action@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # 2.3.1
      with:
        tool: cargo-deny
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}
    - name: Block PRs that introduce banned or compromised crates
      run: cargo deny --log-level error check bans
