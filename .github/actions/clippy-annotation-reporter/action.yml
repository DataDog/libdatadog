name: 'Clippy Annotation Reporter'
description: 'Reports changes in Clippy allow annotations'
author: 'Datadog'

inputs:
  github-token:
    description: 'GitHub token for PR comment access'
    required: true
    default: ${{ github.token }}
  allow-annotation-rules:
    description: 'Comma-separated list of clippy rules to track'
    required: false
    default: 'unwrap_used,expect_used,todo,unimplemented,panic,unreachable'
  base-branch:
    description: 'Base branch to compare against'
    required: false
    default: 'origin/main'
  log_level:
    description: 'Log level (error, warn, info, debug, trace)'
    required: false
    default: 'info'

runs:
  using: 'composite'
  steps:
    # The helper crates' dependencies have moved past the workspace MSRV, so
    # build them on the pinned latest stable from the repo-root
    # ci-toolchain.toml instead of the rust-toolchain.toml MSRV.
    - name: Read stable version from ci-toolchain.toml
      id: stable-version
      shell: bash
      run: echo "version=$(grep -Po '^stable = "\K[^"]+' ${{ github.action_path }}/../../../ci-toolchain.toml)" >> $GITHUB_OUTPUT
    - name: Install ${{ steps.stable-version.outputs.version }} toolchain
      shell: bash
      run: |
        rustup set profile minimal
        rustup toolchain install ${{ steps.stable-version.outputs.version }}

    - name: Fetch all branches
      shell: bash
      run: |
        git fetch --all
        echo "Available branches:"
        git branch -a

    - name: Build annotation reporter
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.stable-version.outputs.version }}
      run: |
        cd ${{ github.action_path }}/..
        cargo build --release -p clippy-annotation-reporter
    - name: Run annotation reporter
      shell: bash
      run: |
        ${{ github.action_path }}/../target/release/clippy-annotation-reporter \
          --token "${{ inputs.github-token }}" \
          --rules "${{ inputs.allow-annotation-rules }}" \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.number }}" \
          --base-branch "${{ inputs.base_branch }}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
