[package]
name = "builder"
build = "build/main.rs"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Default features to release
default = [
  "crashtracker",
  "profiling",
  "telemetry",
  "data-pipeline",
  "symbolizer",
  "library-config",
  "log",
  "ddsketch",
  "ffe",
  "shared-runtime",
  "catch_panic",
]
crashtracker = []
profiling = []
telemetry = []
data-pipeline = []
# Enable zstd compression for the agentless trace intake sender. Native builds
# link the C implementation; WASM builds use pure-Rust zrip.
data-pipeline-compression = ["data-pipeline"]
# Enable client-side stats obfuscation in the data-pipeline crate.
data-pipeline-stats-obfuscation = ["data-pipeline"]
# Temporary: expose exporter observations for hosts that run their own telemetry client. To be
# removed once the native telemetry client no longer needs to be bypassed. Consumers of the
# generated header must define DDOG_TRACE_EXPORTER_EXTERNAL_OBSERVATIONS to see the API.
data-pipeline-external-observations = ["data-pipeline"]
symbolizer = []
library-config = []
log = []
ddsketch = []
ffe = []
shared-runtime = []
otel-thread-ctx = []
catch_panic = []
regex-lite = ["libdd-common/regex-lite"]

[lib]
bench = false
doctest = false

[dependencies]
anyhow.workspace = true
build_common = { path = "../build-common", features = ["cbindgen"] }
cmake.workspace = true
pico-args.workspace = true
# Only reads/writes tar archives; no extended-attribute handling needed.
tar.workspace = true
tools = { path = "../tools" }
toml = { workspace = true, features = ["parse"] }
serde.workspace = true
libdd-common = { path = "../libdd-common", default-features = false }

[[bin]]
name = "release"
path = "src/bin/release.rs"
test = false
bench = false
