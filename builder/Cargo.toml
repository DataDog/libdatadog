[package]
name = "builder"
build = "build/main.rs"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Default features to release
default = [
  "crashtracker",
  "profiling",
  "telemetry",
  "data-pipeline",
  "symbolizer",
  "library-config",
  "log",
  "ddsketch",
  "ffe",
  "shared-runtime",
  "catch_panic",
]
crashtracker = []
profiling = []
telemetry = []
data-pipeline = []
# Enable zstd compression for the agentless trace intake sender. Native builds
# link the C implementation; WASM builds use pure-Rust zrip.
data-pipeline-compression = ["data-pipeline"]
# Enable client-side stats obfuscation in the data-pipeline crate without pulling
# in the agentless export path.
data-pipeline-stats-obfuscation = ["data-pipeline"]
# Enable agentless APM trace export (and span obfuscation on that path) over the
# C FFI. The underlying data-pipeline crate's `stats-obfuscation` is enabled
# transitively via `libdd-data-pipeline/agentless`.
data-pipeline-agentless = ["data-pipeline"]
symbolizer = []
library-config = []
log = []
ddsketch = []
ffe = []
shared-runtime = []
otel-thread-ctx = []
catch_panic = []
regex-lite = ["libdd-common/regex-lite"]

[lib]
bench = false
doctest = false

[dependencies]
anyhow.workspace = true
build_common = { path = "../build-common", features = ["cbindgen"] }
cmake = "0.1.50"
pico-args = "0.5.0"
tar = "0.4.45"
tools = { path = "../tools" }
toml = "0.8.19"
serde.workspace = true
libdd-common = { path = "../libdd-common", default-features = false }

[[bin]]
name = "release"
path = "src/bin/release.rs"
test = false
bench = false
