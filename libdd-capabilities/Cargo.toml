[package]
name = "libdd-capabilities"
version = "4.0.1"
description = "Portable capability traits for cross-platform libdatadog"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-capabilities"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-capabilities"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[dependencies]
http = { workspace = true, features = ["std"], optional = true }
bytes = { workspace = true, features = ["std"], optional = true }
anyhow = { workspace = true, default-features = true, optional = true }
thiserror = { workspace = true, default-features = true, optional = true }
futures-channel = { workspace = true, features = ["std"], optional = true }
futures-util = { workspace = true, features = ["alloc"], optional = true }

[features]
default = ["std"]
std = [
    "dep:anyhow",
    "dep:bytes",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:http",
    "dep:thiserror",
]
