[package]
name = "libdd-library-config"
version = "4.1.0"
description = "Configuration management library for Datadog products."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-library-config"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-library-config"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[features]
default = ["std", "process-context-writer"]
std = [
    "serde/std",
    "anyhow/std",
    "yaml_serde/std",
    "dep:prost",
    "dep:rand",
    "dep:rmp-serde",
    "dep:libdd-trace-protobuf",
    "dep:memfd",
    "dep:libc",
]
otel-thread-ctx = ["process-context-writer"]
process-context-reader = ["std"]
process-context-writer = ["std"]

[dependencies]
serde = { workspace = true, features = ["derive", "alloc"] }
yaml_serde = { workspace = true }
prost = { workspace = true, features = ["std"], optional = true }
anyhow.workspace = true
thiserror.workspace = true

rand = { workspace = true, default-features = true, optional = true }
rmp-serde = { workspace = true, optional = true }

libdd-trace-protobuf = { version = "5.0.1", path = "../libdd-trace-protobuf", optional = true }

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[target.'cfg(unix)'.dependencies]
memfd = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
