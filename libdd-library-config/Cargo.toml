[package]
name = "libdd-library-config"
version = "4.0.0"
description = "Configuration management library for Datadog products."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-library-config"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-library-config"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[features]
default = ["process-context-writer"]
otel-thread-ctx = ["process-context-writer"]
process-context-reader = []
process-context-writer = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
# Only the `Message` trait is used (types come from libdd-trace-protobuf); no derive here.
prost = { workspace = true, default-features = false, features = ["std"] }
anyhow.workspace = true
rand = { workspace = true, default-features = true }
# Direct dep unused in sources (only rmp-serde is used, which pulls rmp itself).
rmp = { workspace = true, default-features = false }
rmp-serde.workspace = true

libdd-trace-protobuf = { version = "5.0.0", path = "../libdd-trace-protobuf" }

[dev-dependencies]
tempfile.workspace = true
serial_test = { workspace = true, default-features = false }

[target.'cfg(unix)'.dependencies]
memfd.workspace = true
libc.workspace = true

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
