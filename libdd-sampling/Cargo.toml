[package]
name = "libdd-sampling"
version = "7.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-sampling"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-sampling"
description = "Core sampling logic for Datadog tracing"
authors.workspace = true
autobenches = false

[lib]
bench = false

[[bench]]
name = "sampling_bench"
harness = false
path = "benches/sampling_bench.rs"
required-features = ["v04_span"]

[[bench]]
name = "glob_matcher_bench"
harness = false
path = "benches/glob_matcher_bench.rs"
required-features = ["bench-internals"]

[[bench]]
name = "trace_model_bench"
harness = false
path = "benches/trace_model_bench.rs"
required-features = ["trace_model"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
lru = { workspace = true, default-features = true }
libdd-common = { path = "../libdd-common", version = "7.0.0", default-features = false }
libdd-trace-utils = { path = "../libdd-trace-utils", version = "13.0.0", optional = true }
libdd-trace-model = { path = "../libdd-trace-model", version = "0.1.0", optional = true }

[features]
v04_span = ["dep:libdd-trace-utils"]
trace_model = ["dep:libdd-trace-model"]
# Exposes internal modules (e.g. `glob_matcher`) for benchmarks. Not intended for downstream
# consumers — enable only when running benches in this crate.
bench-internals = []

[dev-dependencies]
criterion.workspace = true
libdd-common = { path = "../libdd-common", version = "7.0.0", features = ["bench-utils"] }
libdd-trace-utils = { path = "../libdd-trace-utils", version = "13.0.0", default-features = false }
