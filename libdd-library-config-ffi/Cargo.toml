[package]
name = "libdd-library-config-ffi"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
bench = false

[features]
default = ["std", "cbindgen", "catch_panic"]
std = [
    "dep:libdd-common",
    "dep:anyhow",
    "libdd-library-config/std",
    "libdd-library-config/process-context-writer",
    "libdd-common-ffi/std",
]
cbindgen = ["std", "build_common/cbindgen", "libdd-common-ffi/cbindgen"]
catch_panic = []
# Provides a libc-backed #[global_allocator], #[panic_handler], and rust_eh_personality for
# building a standalone no_std staticlib/cdylib. Must be built with panic=abort.
standalone = ["dep:libc_alloc"]
regex-lite = ["libdd-common-ffi/regex-lite"]

[dependencies]
libdd-common = { path = "../libdd-common", optional = true }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false }
libdd-library-config = { path = "../libdd-library-config", default-features = false }
anyhow = { workspace = true, optional = true }
constcat.workspace = true
libc_alloc = { workspace = true, optional = true }

[build-dependencies]
build_common = { path = "../build-common" }

[dev-dependencies]

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
