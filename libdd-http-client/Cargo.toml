[package]
name = "libdd-http-client"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "HTTP client library intended for use by other languages via FFI"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-http-client"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-http-client"

[lib]
bench = false

[features]
default = ["https", "reqwest-backend"]
# Use rustls-no-provider to avoid reqwest forcing aws-lc-rs. reqwest then relies on
# the process-wide provider, which `crypto::ensure_crypto_provider` installs (ring).
# `libdd-common` is only in the graph under `hyper-backend`, so it cannot be relied
# on for this: its connector installs a provider for the hyper path alone.
https = ["dep:reqwest", "reqwest?/rustls-no-provider", "dep:rustls", "rustls?/ring", "libdd-common?/https"]
reqwest-backend = ["dep:reqwest", "reqwest?/hickory-dns", "reqwest?/multipart"]
hyper-backend = [
    "dep:libdd-common",
    "libdd-common/http-client",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
]
# Honor HTTPS_PROXY/NO_PROXY environment variables in the hyper backend.
hyper-proxy = ["hyper-backend", "libdd-common?/hyper-proxy"]
# `rustls?/fips` (not `rustls?/aws-lc-rs`) is what builds aws-lc-rs in FIPS mode: it
# pulls aws-lc-fips-sys, whereas plain `aws-lc-rs` pulls non-FIPS aws-lc-sys. The
# `libdd-common?/fips` below only applies under `hyper-backend`, where libdd-common is
# in the graph at all, so it cannot be what puts this build in FIPS mode.
fips = ["dep:reqwest", "reqwest?/rustls-no-provider", "dep:rustls", "rustls?/fips", "libdd-common?/fips"]

[dependencies]
bytes = { workspace = true, features = ["std"] }
thiserror = { workspace = true, default-features = true }
fastrand = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "time"] }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
libdd-common = { version = "6.0.0", path = "../libdd-common", default-features = false, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "client"] }
hyper-util = { workspace = true, optional = true, features = ["http1", "client", "client-legacy"] }
http-body-util = { workspace = true, optional = true }


[dev-dependencies]
httpmock.workspace = true
# No provider features here on purpose: tests must not add a crypto provider that
# the crate itself does not link. Used to assert which provider ends up installed.
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "net"] }
tempfile.workspace = true
