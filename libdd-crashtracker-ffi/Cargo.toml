[package]
name = "libdd-crashtracker-ffi"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
bench = false
crate-type = ["lib", "cdylib"]

[[bin]]
name = "test_app"
path = "tests/test_app/src/main.rs"
bench = false
required-features = ["collector_windows"]

[features]
default = ["cbindgen", "collector", "demangler", "receiver"]
cbindgen = ["build_common/cbindgen"]
regex-lite = ["libdd-common-ffi/regex-lite"]
# Enables the in-process collection of crash-info
collector = []
collector_windows = []
demangler = ["dep:symbolic-demangle", "dep:symbolic-common"]
# Enables the use of this library to receiver crash-info from a suitable collector
receiver = []

[target.'cfg(windows)'.features]
default = ["collector_windows"]

[build-dependencies]
build_common = { path = "../build-common" }

[dependencies]
anyhow.workspace = true
libdd-crashtracker = { path = "../libdd-crashtracker" }
libdd-common = { path = "../libdd-common" }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false }
symbolic-demangle = { workspace = true, features = ["rust", "cpp", "msvc"], optional = true }
symbolic-common = { workspace = true, optional = true }
function_name.workspace = true
libc.workspace = true
serde_json.workspace = true
# serde is not referenced by this crate's code; keep only the `derive` feature
# (serde_json in tests pulls in the rest transitively).
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["std", "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["std", "Win32_System_LibraryLoader"] }
