[package]
name = "libdd-tracer-flare"
version = "2.0.0"
description = "Rust library for collecting and transmitting Datadog tracer diagnostic flares via remote configuration."
rust-version.workspace = true
edition.workspace = true
license.workspace = true
autobenches = false
authors.workspace = true
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-tracer-flare"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-tracer-flare"

[dependencies]
anyhow = "1.0"
libdd-remote-config = { version = "4.0.0", path = "../libdd-remote-config", default-features = false }
libdd-common = { version = "5.2.0", path = "../libdd-common" }
libdd-trace-utils = { version = "11.0.0", path = "../libdd-trace-utils" }
http = "1"
bytes = "1.11.1"
tokio = { workspace = true, features = ["time"] }
serde_json.workspace = true
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }
walkdir = "2.4"
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libdd-capabilities-impl = { version = "4.0.0", path = "../libdd-capabilities-impl", default-features = false }

[lib]
bench = false

[dev-dependencies]
libdd-remote-config = { path = "../libdd-remote-config", features = ["test"] }
httpmock = "0.8.0-alpha.1"
libdd-trace-utils = { path = "../libdd-trace-utils", features = ["test-utils"] }
tokio = { version = "1.36.0", features = ["time", "macros", "rt"] }

[features]
default = ["listener"]
agentless = ["libdd-remote-config/agentless"]
listener = ["libdd-remote-config/client"]
