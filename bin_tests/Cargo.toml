[package]
name = "bin_tests"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = { workspace = true, features = ["std"] }
anyhow = { workspace = true, default-features = true }
current_platform.workspace = true
libdd-crashtracker = { path = "../libdd-crashtracker" }
libdd-common = { path = "../libdd-common" }
tempfile.workspace = true
serde_json.workspace = true
libc.workspace = true
errno = { workspace = true, default-features = true }
nix = { workspace = true, features = ["signal", "socket"] }
os_info.workspace = true

[dev-dependencies]
serial_test.workspace = true

[features]
regex-lite = ["libdd-common/regex-lite"]

[lib]
bench = false

[[bin]]
name = "crashtracker_bin_test"
bench = false

[[bin]]
name = "test_the_tests"
bench = false

[[bin]]
name = "test_crashtracker_receiver"
path = "src/bin/crashtracker_receiver.rs"
bench = false

[[bin]]
name = "crashing_test_app"
bench = false

[[bin]]
name = "crashtracker_unix_socket_receiver"
bench = false

[[bin]]
name = "prebuild"
path = "src/bin/prebuild.rs"
bench = false
