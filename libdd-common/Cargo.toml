[package]
name = "libdd-common"
version = "9.0.0"
description = "Shared utilities for Datadog libraries including endpoint handling and tag validation"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[dependencies]
anyhow = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
hex = { workspace = true, features = ["std"], optional = true }
http = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true, features = ["derive"] }
static_assertions = { workspace = true, optional = true }
const_format = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true, default-features = true }

[features]
default = ["std"]
alloc = [
    "dep:anyhow",
    "dep:const_format",
    "dep:static_assertions",
    "serde/alloc",
]
std = [
    "alloc",
    "anyhow/std",
    "dep:arc-swap",
    "dep:hex",
    "dep:http",
    "serde/std",
]

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
