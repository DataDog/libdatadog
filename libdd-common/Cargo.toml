[package]
name = "libdd-common"
version = "9.0.0"
description = "Shared utilities for Datadog libraries including container entity detection, tag validation, rate limiting, and Unix/Windows platform helpers"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[dependencies]
anyhow = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
hex = { workspace = true, default-features = true, optional = true }
httparse = { workspace = true, features = ["std"], optional = true }
http = { workspace = true, features = ["std"], optional = true }
rand = { workspace = true, default-features = true, optional = true }
regex = { workspace = true, features = ["std", "unicode", "perf"], optional = true }
regex-lite = { workspace = true, default-features = true, optional = true }
thiserror = { workspace = true, default-features = true, optional = true }
serde = { workspace = true, features = ["derive"] }
static_assertions = { workspace = true, optional = true }
const_format = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
optional = true
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
]

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
indexmap = { workspace = true, default-features = true }
maplit.workspace = true
proptest = { workspace = true, default-features = true }
rand = { workspace = true, default-features = true }
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }
tokio-rustls.workspace = true
tools = { path = "../tools", default-features = false, features = ["test-utils"] }

[features]
default = ["std"]
alloc = [
    "dep:anyhow",
    "dep:const_format",
    "dep:static_assertions",
    "serde/alloc",
]
std = [
    "alloc",
    "anyhow/std",
    "dep:arc-swap",
    "dep:hex",
    "dep:http",
    "dep:libc",
    "dep:nix",
    "dep:regex",
    "dep:thiserror",
    "dep:windows-sys",
    "serde/std",
]
# Enable this feature to enable stubbing of cgroup
# php directly import this crate and uses functions gated by this feature for their test
cgroup_testing = ["std"]
# Use regex-lite instead of regex for smaller binary size
regex-lite = ["std", "dep:regex-lite"]
# Consumers that handle user-provided regexes can enable this feature to force
# the full `regex` crate, overriding `regex-lite` when both are active.
require-regex-full = ["std"]

[lints.rust]
# We run coverage checks in our github actions. These checks are run with
# --all-features which is incompatible with our fips feature. The crypto
# provider default needs to be set by the caller in fips mode. For now, we want
# to make sure that the coverage tests use the non-fips version of the crypto
# provider initialization logic, so we added a coverage cfg check on the
# function in src/connector/mod.rs. The coverage config is actually not used in
# normal environments, so we need to let the rust linter know that it is in
# fact a real thing, though one that shows up only in some situations.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
collapsible_if = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
