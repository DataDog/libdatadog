[package]
name = "libdd-common"
version = "9.0.0"
description = "Shared utilities for Datadog libraries including container entity detection and tag validation"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-common"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]
bench = false

[dependencies]
anyhow = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
http = { workspace = true, features = ["std"], optional = true }
libdd-regex = { version = "0.1.0", path = "../libdd-regex", optional = true }
thiserror = { workspace = true, default-features = true, optional = true }
serde = { workspace = true, features = ["derive"] }
static_assertions = { workspace = true, optional = true }
const_format = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
optional = true
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
]

[dev-dependencies]
indexmap = { workspace = true, default-features = true }
maplit.workspace = true
proptest = { workspace = true, default-features = true }
tempfile.workspace = true

[features]
default = ["std"]
alloc = [
    "dep:anyhow",
    "dep:const_format",
    "dep:static_assertions",
    "serde/alloc",
]
std = [
    "alloc",
    "anyhow/std",
    "dep:arc-swap",
    "dep:http",
    "dep:libc",
    "dep:libdd-regex",
    "dep:thiserror",
    "dep:windows-sys",
    "serde/std",
]
# Enable this feature to enable stubbing of cgroup
# php directly import this crate and uses functions gated by this feature for their test
cgroup_testing = ["std"]

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
