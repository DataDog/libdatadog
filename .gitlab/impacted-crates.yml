# Computes the set of crates impacted by a PR (the changed crates plus their transitive
# dependents) and publishes it for downstream test-stage jobs to consume.
#
# It reuses the crates-reporter tool that already backs GitHub CI (.github/actions/). That
# tool writes its results to the file named by $GITHUB_OUTPUT, so we point $GITHUB_OUTPUT at
# a temp file and parse it here -- no changes to the Rust code are required.
#
# The benchmarks job consumes this directly; trigger_internal_build forwards it to the
# libddprof-build pipeline as trigger variables.

compute_impacted_crates:
  stage: test
  tags: ["arch:amd64"]
  image:
    name: $BASE_CI_IMAGE
  needs: []
  rules:
    - !reference [.untrusted_ref_guard, rules]
    # Nothing to compute where benchmarks won't consume it: main runs the full suite, and
    # release/hotfix/merge-queue/scheduled pipelines don't run benchmarks at all.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  variables:
    # Full history so the three-dot merge-base diff against origin/main resolves.
    GIT_DEPTH: 0
  # A failure leaves the outputs absent; downstream jobs then fall back to running everything.
  allow_failure: true
  script:
    # Always emit impacted-crates.env and changed_files.txt, even if crate detection fails -- that
    # way the benchmarks job always receives its needed artifacts and falls back to the full suite
    # (IMPACTED_STATUS=skipped) instead of erroring on a missing archive.
    - |
      export GITHUB_OUTPUT="$(mktemp)"
      git fetch --no-tags origin main || :
      if (cd .github/actions && cargo build --release -p crates-reporter) \
         && ./.github/actions/target/release/crates-reporter main; then
        :
      else
        echo "status=skipped" >> "$GITHUB_OUTPUT"
      fi
      # Surface the crates-reporter outputs as dotenv variables for downstream jobs.
      AFFECTED_CRATES=$(sed -n 's/^affected_crates=//p' "$GITHUB_OUTPUT" | tail -n1)
      IMPACTED_STATUS=$(sed -n 's/^status=//p' "$GITHUB_OUTPUT" | tail -n1)
      : "${AFFECTED_CRATES:=[]}"
      : "${IMPACTED_STATUS:=skipped}"
      printf 'AFFECTED_CRATES=%s\nIMPACTED_STATUS=%s\n' "$AFFECTED_CRATES" "$IMPACTED_STATUS" | tee impacted-crates.env
      # Record the changed files so downstream jobs can make path-based decisions.
      git diff --name-only origin/main...HEAD > changed_files.txt || : > changed_files.txt
      # Classifications for the downstream pipeline, which cannot read changed_files.txt.
      # - FFI_TOUCHED=false skips packaging. Absent means undetermined, making the the full chain run.
      # - WORKSPACE_LEVEL_CHANGE indicates if there are workspace-level changes that can affect everything.
      FFI_PATH_RE='(^[a-z0-9][a-z0-9-]*-ffi/|^builder/|^build-common/|^cmake/|^examples/ffi/|^tests/run-package-tests\.ps1$|^tests/windows_package/|^windows/|^Cargo\.lock$|^Cargo\.toml$|^Cross\.toml$|^rust-toolchain\.toml$|^nightly-toolchain\.toml$|^\.cargo/)'
      WORKSPACE_LEVEL_RE='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|nightly-toolchain\.toml|\.cargo/config\.toml|\.config/nextest\.toml)$'
      if [[ -s changed_files.txt ]]; then
        if grep -Eq "$FFI_PATH_RE" changed_files.txt; then
          echo "FFI_TOUCHED=true" >> impacted-crates.env
        else
          echo "FFI_TOUCHED=false" >> impacted-crates.env
        fi
        if grep -Eq "$WORKSPACE_LEVEL_RE" changed_files.txt; then
          echo "WORKSPACE_LEVEL_CHANGE=true" >> impacted-crates.env
        else
          echo "WORKSPACE_LEVEL_CHANGE=false" >> impacted-crates.env
        fi
      fi
  artifacts:
    when: always
    reports:
      dotenv: impacted-crates.env
    paths:
      - changed_files.txt
    expire_in: 1 week

# Computes which *individual benchmarks* (well: benchmark clusters — every bench
# binary, then the first `/`-segment of each criterion bench ID inside it) a PR
# should run, by building the affected bench crates with `-C
# instrument-coverage`, running every cluster once (criterion `--test`), and
# intersecting the executed-function line coverage with the PR's changed lines.
# The tool lives in .github/actions/bench-selector (see its sources for the
# design and the fail-conservative rules).
#
# The benchmarks job consumes bench-selection.json when this job succeeds;
# anything else (missing output, non-success status, undetermined impacted
# crates, workspace-level changes) makes it fall back to the crate-level
# selection it already had, so this job can never reduce what runs on failure.
compute_bench_selection:
  stage: test
  tags: ["arch:amd64"]
  image:
    name: $BASE_CI_IMAGE
  needs:
    # Optional: absent on main / release / merge-queue pipelines, and this job
    # never runs there either (same rules as compute_impacted_crates).
    - job: compute_impacted_crates
      artifacts: true
      optional: true
  rules:
    - !reference [.untrusted_ref_guard, rules]
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  variables:
    # select diffs against origin/main; full history makes the merge-base resolve.
    GIT_DEPTH: 0
    # sccache for this job's cargo builds (bench-selector and the selection
    # pass's dependency graphs). Own key prefix: this job's RUSTFLAGS
    # (-C instrument-coverage) and target dirs never match the benchmarks
    # job's cache keys, exactly like that job's prefix never matches the
    # release-build pipeline's. BASEDIRS strips the checkout path so hits
    # survive different runner build directories.
    SCCACHE_BUCKET: dd-sccache-storage-us1-ddbuild-io
    SCCACHE_REGION: us-east-1
    SCCACHE_S3_KEY_PREFIX: libdatadog/bench-selection/sccache
    SCCACHE_ERROR_LOG: /tmp/sccache.log
    SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    SCCACHE_BASEDIRS: $CI_PROJECT_DIR
    CARGO_INCREMENTAL: "0"
  # Same posture as compute_impacted_crates: a failure falls back downstream
  # instead of failing the pipeline.
  allow_failure: true
  script:
    # Always emit a dotenv so the benchmarks job always receives its needed
    # artifacts and falls back to crate-level selection on anything unexpected.
    - |
      set -eu
      # Write the dotenv up front ("failed" by default) so the artifact always
      # exists, even if a later step dies; each early exit rewrites it.
      printf 'BENCH_SELECTION_STATUS=failed\n' | tee bench-selection.env
      status() { printf 'BENCH_SELECTION_STATUS=%s\n' "$1" | tee bench-selection.env; }
      if [[ "${IMPACTED_STATUS:-}" != "success" || -z "${AFFECTED_CRATES:-}" ]]; then
        echo "Impacted crates undetermined -> benchmarks fall back to crate-level selection."
        status skipped
        exit 0
      fi
      # Workspace-level changes that per-benchmark selection cannot scope
      # (profiles, toolchain, cargo config) -> the benchmarks job runs the
      # full suite. Cargo.lock is deliberately NOT in this list: a lockfile
      # bump is scoped by bench-selector against the packages each bench
      # cluster executes, so it flows through below. (WORKSPACE_LEVEL_CHANGE
      # is not used here because it still includes Cargo.lock.)
      if grep -qE '^(Cargo\.toml|rust-toolchain\.toml|ci-toolchain\.toml)$' changed_files.txt 2>/dev/null \
         || grep -qE '^(\.cargo/|\.config/nextest\.toml)' changed_files.txt 2>/dev/null; then
        echo "Workspace-level profile/toolchain change -> full benchmark suite."
        status skipped
        exit 0
      fi
      # The coverage pass needs llvm-profdata/llvm-cov matching rustc: the
      # llvm-tools-preview component of the active (MSRV) toolchain provides
      # them (bench-selector prefers it over any system LLVM, whose profile
      # format may not match).
      rustup component add llvm-tools-preview
      # Validation-branch adjustment: the checkout's MSRV (1.87) predates this
      # tool's dependencies, so build bench-selector on the pinned stable; and
      # pin the rustup llvm-tools first in PATH so they win over any system
      # llvm (the coverage tooling prefers PATH, and versions must match the
      # rustc that produces the profiles).
      rustup toolchain install 1.99.1 --profile minimal
      SYSROOT="$(rustc --print sysroot)"
      HOST_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
      export PATH="${SYSROOT}/lib/rustlib/${HOST_TRIPLE}/bin:${PATH}"
      # Best-effort compiler cache for everything this job builds (the tool
      # and the selection pass's cargo builds). No cache problem may fail
      # the job: fall back to building without it.
      if command -v sccache > /dev/null 2>&1 && sccache --start-server > /dev/null 2>&1; then
        export RUSTC_WRAPPER=sccache
      else
        echo "sccache unavailable or failed to start; building without a compiler cache"
      fi
      # The tool's own runtime is negligible against the job's cargo builds,
      # so a debug build keeps its compile cost down.
      (cd .github/actions && RUSTUP_TOOLCHAIN=1.99.1 cargo build -p bench-selector)
      SELECTOR=./.github/actions/target/debug/bench-selector
      # Restrict to the crates this PR affects; inventory/coverage skip the rest.
      # A lockfile bump can affect any crate's benchmarks (the changed packages
      # may be exercised by any bench cluster), so it spans every bench crate.
      # inventory and coverage share the same --target-dir: the `--list` builds
      # are instrumented in it, so the coverage pass's builds are cache hits —
      # one build of the dependency graph instead of two.
      CRATES_ARGS=()
      if ! grep -qE '^Cargo\.lock$' changed_files.txt 2>/dev/null; then
        CRATES="$(jq -r '.[]' <<< "${AFFECTED_CRATES}" | paste -sd ',')"
        CRATES_ARGS=(--crates "$CRATES")
      fi
      "$SELECTOR" inventory --workspace-root . "${CRATES_ARGS[@]}" \
        --target-dir target/bench-selection \
        --out bench-inventory.json
      "$SELECTOR" coverage \
        --inventory bench-inventory.json \
        "${CRATES_ARGS[@]}" \
        --target-dir target/bench-selection \
        --out bench-coverage.json
      "$SELECTOR" select \
        --inventory bench-inventory.json \
        --coverage bench-coverage.json \
        --base-ref main \
        --out bench-selection.json
      sccache --show-stats || :
      sccache --stop-server > /dev/null 2>&1 || :
      status success
  artifacts:
    when: always
    reports:
      dotenv: bench-selection.env
    paths:
      - bench-selection.json
      - bench-inventory.json
      - bench-coverage.json
    expire_in: 1 week
