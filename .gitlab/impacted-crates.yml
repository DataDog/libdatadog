# Computes the set of crates impacted by a PR (the changed crates plus their transitive
# dependents) and publishes it for downstream test-stage jobs to consume.
#
# It reuses the crates-reporter tool that already backs GitHub CI (.github/actions/). That
# tool writes its results to the file named by $GITHUB_OUTPUT, so we point $GITHUB_OUTPUT at
# a temp file and parse it here -- no changes to the Rust code are required.
#
# The benchmarks job consumes this directly; trigger_internal_build forwards it to the
# libddprof-build pipeline as trigger variables.

compute_impacted_crates:
  stage: test
  tags: ["arch:amd64"]
  image:
    name: $BASE_CI_IMAGE
  needs: []
  rules:
    - !reference [.untrusted_ref_guard, rules]
    # Nothing to compute where benchmarks won't consume it: main runs the full suite, and
    # release/hotfix/merge-queue/scheduled pipelines don't run benchmarks at all.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)\//'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  variables:
    # Full history so the three-dot merge-base diff against origin/main resolves.
    GIT_DEPTH: 0
  # A failure leaves the outputs absent; downstream jobs then fall back to running everything.
  allow_failure: true
  script:
    # Always emit impacted-crates.env and changed_files.txt, even if crate detection fails -- that
    # way the benchmarks job always receives its needed artifacts and falls back to the full suite
    # (IMPACTED_STATUS=skipped) instead of erroring on a missing archive.
    - |
      export GITHUB_OUTPUT="$(mktemp)"
      git fetch --no-tags origin main || :
      # --pr-merge: this pipeline runs on the PR head, so compute the changes the PR brings when
      # merged into main (from GitHub's test merge commit), not those since it branched off.
      if (cd .github/actions && cargo build --release -p crates-reporter) \
         && ./.github/actions/target/release/crates-reporter --pr-merge main; then
        :
      else
        echo "status=skipped" >> "$GITHUB_OUTPUT"
      fi
      # Surface the crates-reporter outputs as dotenv variables for downstream jobs.
      AFFECTED_CRATES=$(sed -n 's/^affected_crates=//p' "$GITHUB_OUTPUT" | tail -n1)
      IMPACTED_STATUS=$(sed -n 's/^status=//p' "$GITHUB_OUTPUT" | tail -n1)
      : "${AFFECTED_CRATES:=[]}"
      : "${IMPACTED_STATUS:=skipped}"
      DIFF_BASE=$(sed -n 's/^diff_base=//p' "$GITHUB_OUTPUT" | tail -n1)
      DIFF_HEAD=$(sed -n 's/^diff_head=//p' "$GITHUB_OUTPUT" | tail -n1)
      printf 'AFFECTED_CRATES=%s\nIMPACTED_STATUS=%s\n' "$AFFECTED_CRATES" "$IMPACTED_STATUS" | tee impacted-crates.env
      # Record the changed files so downstream jobs can make path-based decisions, from the same
      # revisions as the crates when crates-reporter got that far.
      if [[ -n "$DIFF_BASE" && -n "$DIFF_HEAD" ]]; then
        printf 'IMPACTED_DIFF_BASE=%s\nIMPACTED_DIFF_HEAD=%s\n' "$DIFF_BASE" "$DIFF_HEAD" | tee -a impacted-crates.env
        git diff --name-only "$DIFF_BASE" "$DIFF_HEAD" > changed_files.txt || : > changed_files.txt
      else
        git diff --name-only origin/main...HEAD > changed_files.txt || : > changed_files.txt
      fi
      # Classifications for the downstream pipeline, which cannot read changed_files.txt.
      # - FFI_TOUCHED=false skips packaging. Absent means undetermined, making the the full chain run.
      # - WORKSPACE_LEVEL_CHANGE indicates if there are workspace-level changes that can affect everything.
      FFI_PATH_RE='(^[a-z0-9][a-z0-9-]*-ffi/|^builder/|^build-common/|^cmake/|^examples/ffi/|^tests/run-package-tests\.ps1$|^tests/windows_package/|^windows/|^Cargo\.lock$|^Cargo\.toml$|^Cross\.toml$|^rust-toolchain\.toml$|^ci-toolchain.toml$|^\.cargo/)'
      WORKSPACE_LEVEL_RE='^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml|ci-toolchain\.toml|\.cargo/config\.toml|\.config/nextest\.toml)$'
      if [[ -s changed_files.txt ]]; then
        if grep -Eq "$FFI_PATH_RE" changed_files.txt; then
          echo "FFI_TOUCHED=true" >> impacted-crates.env
        else
          echo "FFI_TOUCHED=false" >> impacted-crates.env
        fi
        if grep -Eq "$WORKSPACE_LEVEL_RE" changed_files.txt; then
          echo "WORKSPACE_LEVEL_CHANGE=true" >> impacted-crates.env
        else
          echo "WORKSPACE_LEVEL_CHANGE=false" >> impacted-crates.env
        fi
      fi
  artifacts:
    when: always
    reports:
      dotenv: impacted-crates.env
    paths:
      - changed_files.txt
    expire_in: 1 week
