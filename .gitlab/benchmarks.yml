.benchmark_run_rules: &benchmark_run_rules
  - !reference [.untrusted_ref_guard, rules]
  - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
    when: never
  - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)[-\/]/'
    when: never
  - if: '$CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)[-\/]/'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main"'
    interruptible: false
  - interruptible: true

.clone_benchmarking_platform:
  script:
    # Wrapped in a subshell so `set -euo pipefail` stays local.
    - |
      (
        set -euo pipefail
        git clone --branch libdatadog/benchmarks \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/benchmarking-platform" /platform
        git -C /platform checkout --detach "${BENCHMARKING_PLATFORM_SHA}"
        # Drop the credential-bearing remote. Neither job pushes, and code from the tested commit
        # runs later in this same container -- leaving $CI_JOB_TOKEN in /platform/.git/config would
        # hand it to that code for free.
        git -C /platform remote set-url origin "https://gitlab.ddbuild.io/DataDog/benchmarking-platform"
      )
    - unset CI_JOB_TOKEN

# The benchmark suite is sharded across parallel jobs to reduce wall-clock time. Each shard runs
# both candidate and baseline for its assigned crates on the same runner (so the comparison stays
# noise-controlled), then benchmarks_combine merges the shards' results into a single PR comment.
benchmarks:
  parallel: 3
  tags: ["runner:apm-k8s-tweaked-metal"]
  needs:
    # Not created on main (which runs the full suite) -- hence optional.
    - job: compute_impacted_crates
      artifacts: true
      optional: true
  image:
    name: $BASE_CI_IMAGE
  rules: *benchmark_run_rules
  timeout: 80m
  retry:
    max: 2
    # Infra failures only; a script_failure (a real benchmark failure) never re-runs.
    when:
      - unknown_failure
      - data_integrity_failure
      - runner_system_failure
      - scheduler_failure
      - api_failure
  script:
    # Decide which crates THIS shard benchmarks. Runs first, while $CI_PROJECT_DIR is the libdatadog
    # checkout (so ./benchmark/... and the compute_impacted_crates artifacts are available). The
    # helper prints SKIP (nothing to do), FULL (whole workspace), or a space-separated crate list;
    # BENCH_PACKAGES is consumed by benchmark/run_benchmarks_ci.sh.
    - |
      set -euo pipefail
      DECISION="$(./benchmark/select_bench_packages.sh "${CI_NODE_INDEX:-1}" "${CI_NODE_TOTAL:-1}")"
      case "$DECISION" in
        SKIP)
          echo "Shard ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1}: nothing to benchmark."
          # Still emit an (empty) artifact dir so benchmarks_combine's needs:artifacts is satisfied.
          mkdir -p "${CI_PROJECT_DIR}/reports-${CI_NODE_INDEX:-1}"
          exit 0
          ;;
        FULL)
          echo "Shard ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1}: full-workspace benchmark run."
          export BENCH_PACKAGES=""
          ;;
        *)
          export BENCH_PACKAGES="$DECISION"
          echo "Shard ${CI_NODE_INDEX:-1}/${CI_NODE_TOTAL:-1} crates: $BENCH_PACKAGES"
          ;;
      esac
    - export CACHE_FAILURES_LOG="${CI_PROJECT_DIR}/.cache-failures.log" && rm -f "${CACHE_FAILURES_LOG}"
    - export ARTIFACTS_DIR="$(pwd)/reports" && (mkdir "${ARTIFACTS_DIR}" || :)
    - !reference [.clone_benchmarking_platform, script]
    - cd /platform
    - ./steps/capture-hardware-software-info.sh
    - |
      SCRIPT_DIR="$(pwd)/steps"
      source ./steps/config-benchmark-env.sh

      checkout_source_with_submodules() {
        local repo_url=$1
        local dest=$2
        local target=$3

        if [[ -d "${dest}" ]]; then
          return
        fi

        git clone "${repo_url}" "${dest}"
        git -C "${dest}" checkout "${target}"
        git -C "${dest}" submodule update --init --recursive
      }

      checkout_source_with_submodules "${UPSTREAM_REPO_URL}" "${CANDIDATE_PATH}" "${CANDIDATE_IDENTIFIER}"

      # Prints the SHA of GitHub's test merge commit (refs/pull/<N>/merge) of the PR whose head is
      # $1 into the branch $2, or fails if there is none (no such PR, conflicts, PR retargeted).
      # GitHub recomputes that ref asynchronously after each push to either side, so it may lag:
      # accept it only once its second parent is our commit, retrying after 10s and then 20s.
      find_pr_merge_commit() {
        local repo=$1 head_sha=$2 target_tip=$3 prs pr merge_sha delay
        # On external-PR pipelines, GitLab tells us which PR this run is about; pin the merge ref
        # to it. Scanning by head SHA alone would be ambiguous: several open PRs can point at the
        # same commit, and one whose base merely is an ancestor of the target branch would pass
        # the checks below, silently benchmarking against the wrong branch.
        if [[ -n "${CI_EXTERNAL_PULL_REQUEST_IID:-}" ]]; then
          prs="refs/pull/${CI_EXTERNAL_PULL_REQUEST_IID}"
        else
          # No PR context (e.g. a branch pipeline): find candidate PRs by matching the head SHA
          # against refs/pull/*/head, which needs no GitHub API call (rate limits, tokens). GitHub
          # keeps those refs after a PR is closed, so several PRs can match (e.g. a PR reopened as
          # a new one from the same branch). Only open PRs have a merge ref, and the checks below
          # keep one that merges our head into the target branch.
          prs="$(git -C "${repo}" ls-remote origin 'refs/pull/*/head' \
                 | awk -v sha="${head_sha}" '$1 == sha { sub(/\/head$/, "", $2); print $2 }')"
        fi
        [[ -n "${prs}" ]] || return 1

        # Try every candidate before waiting, so that closed PRs cost nothing.
        for delay in 0 10 20; do
          if (( delay > 0 )); then
            echo "No up-to-date test merge commit for ${head_sha} yet; retrying in ${delay}s" >&2
            sleep "${delay}"
          fi

          for pr in ${prs}; do
            if git -C "${repo}" fetch --quiet origin "+${pr}/merge:refs/benchmark/pr-merge" 2>/dev/null \
               && merge_sha="$(git -C "${repo}" rev-parse refs/benchmark/pr-merge)" \
               && [[ "$(git -C "${repo}" rev-parse "${merge_sha}^2")" == "${head_sha}" ]] \
               && git -C "${repo}" merge-base --is-ancestor "${merge_sha}^1" "${target_tip}"; then
              echo "${merge_sha}"
              return 0
            fi
          done
        done
        return 1
      }

      # On PRs, benchmark the PR as it would be merged (GitHub's test merge
      # commit) against its first parent, i.e. the target branch it was merged
      # into. This ensures both that we measure the isolated changes of this
      # PR, and we measure them against a recent main (or whatever is the
      # target branch): the merge ref can lag a bit behind the target tip, but
      # its two parents always differ by exactly the PR's changes.
      #
      # Falls back to the PR head against the merge-base when there is no merge
      # ref (conflicts), which isolates the PR's changes just as well but on an
      # older target.
      if [[ "${UPSTREAM_BRANCH}" != "main" && -n "${BASELINE_IDENTIFIER:-}" ]]; then
        target_branch="${BASELINE_IDENTIFIER}"
        head_sha="$(git -C "${CANDIDATE_PATH}" rev-parse "${CANDIDATE_IDENTIFIER}^{commit}")"
        target_ref="refs/benchmark/target"
        if ! git -C "${CANDIDATE_PATH}" fetch --quiet origin "+refs/heads/${target_branch}:${target_ref}"; then
          echo "WARNING: could not fetch ${target_branch}; comparing the PR head against its tip" >&2
        elif merge_sha="$(find_pr_merge_commit "${CANDIDATE_PATH}" "${head_sha}" "${target_ref}")"; then
          merge_parent="$(git -C "${CANDIDATE_PATH}" rev-parse "${merge_sha}^1")"
          echo "Candidate: ${merge_sha}, test merge of ${head_sha} into ${target_branch}"
          echo "Baseline: ${merge_parent} (${target_branch}, first parent of the test merge)"
          git -C "${CANDIDATE_PATH}" checkout --quiet "${merge_sha}"
          git -C "${CANDIDATE_PATH}" submodule update --init --recursive
          # Label the results with the PR head, not the throwaway merge commit, so they show up
          # under the commit the PR comment and the Benchmarking UI are about. Pre-setting these
          # makes config-benchmark-env.sh keep them instead of reading HEAD.
          # git_get_information prints "<version> <hash> <time>", where <version> may be empty.
          head_info="$(git_get_information "${CANDIDATE_PATH}" "${head_sha}")"
          head_time="${head_info##* }" && head_info="${head_info% *}"
          head_hash="${head_info##* }" && head_version="${head_info% *}"
          export CANDIDATE_VERSION="${head_version}~${head_hash}" CANDIDATE_HASH="${head_hash}" CANDIDATE_TIME="${head_time}"
          export CANDIDATE_LONG_NAME="${head_version}~${head_hash} (${CANDIDATE_IDENTIFIER} merged into ${target_branch})"
          export BASELINE_BRANCH="${target_branch}"
          export BASELINE_IDENTIFIER="${merge_parent}"
        elif merge_base="$(git -C "${CANDIDATE_PATH}" merge-base "${head_sha}" "${target_ref}")"; then
          echo "No test merge commit found for ${head_sha} into ${target_branch} (conflicts?)"
          echo "Baseline: merge-base ${merge_base} of ${CANDIDATE_IDENTIFIER} and ${target_branch}"
          export BASELINE_BRANCH="${target_branch}"
          export BASELINE_IDENTIFIER="${merge_base}"
        else
          echo "WARNING: could not compute the merge-base with ${target_branch}; using its tip" >&2
        fi
      fi

      # Refresh benchmark-platform's derived baseline after candidate checkout.
      VERBOSE="true" source ./steps/config-benchmark-env.sh
      checkout_source_with_submodules "${UPSTREAM_REPO_URL}" "${BASELINE_PATH}" "${BASELINE_IDENTIFIER}"
    - ./steps/run-benchmarks.sh
    - ./steps/analyze-results.sh
    - "./steps/upload-results-to-s3.sh || :"
    - "./steps/upload-results-to-benchmarking-api.sh || :"
    # Fail loudly if the run produced no candidate results (e.g. a step exited 0 without actually
    # benchmarking); a legitimate skip exits earlier and never reaches here.
    - |
      set -euo pipefail
      shopt -s nullglob
      candidate_results=("${ARTIFACTS_DIR}"/candidate/*/benchmark-candidate.converted.json)
      if (( ${#candidate_results[@]} == 0 )); then
        echo "ERROR: benchmark run produced no candidate results in ${ARTIFACTS_DIR}" >&2
        exit 1
      fi
    # Hand this shard's reports to benchmarks_combine, which posts the single PR comment.
    - mv "${ARTIFACTS_DIR}" "${CI_PROJECT_DIR}/reports-${CI_NODE_INDEX:-1}"
  after_script:
    - |
      set -u
      f="${CI_PROJECT_DIR}/.cache-failures.log"
      if [[ -e "$f" ]]; then
        echo "" >&2
        echo "CACHE FAILED:" >&2
        cat "$f" >&2
      fi
  artifacts:
    name: "reports-${CI_NODE_INDEX}"
    paths:
      - reports-*/
    expire_in: 3 months
  variables:
    UPSTREAM_PROJECT_ID: $CI_PROJECT_ID # The ID of the current project. This ID is unique across all projects on the GitLab instance.
    UPSTREAM_PROJECT_NAME: $CI_PROJECT_NAME # libdatadog
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME # The branch or tag name for which project is built.
    UPSTREAM_COMMIT_SHA: $CI_COMMIT_SHA # The commit revision the project is built for.
    UPSTREAM_REPO_URL: "https://github.com/DataDog/libdatadog" # The HTTP URL to the project's repository.

    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: libdatadog

    # sccache, consumed by benchmark/run_benchmarks_ci.sh. Its own key prefix,
    # not libddprof-build's: that pipeline builds --release and cargo bench uses
    # [profile.bench], so the -C flags -- and therefore the cache keys -- never
    # match.
    # Our CI role is granted only "libdatadog/*" in this bucket, so the key
    # prefix must stay under it (cloud-inventory gitlab-repositories/libdatadog.json).
    SCCACHE_BUCKET: dd-sccache-storage-us1-ddbuild-io
    SCCACHE_REGION: us-east-1
    SCCACHE_S3_KEY_PREFIX: libdatadog/benchmarks/sccache
    SCCACHE_ERROR_LOG: /tmp/sccache.log
    SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    # Required: candidate and baseline compile at different absolute paths, and
    # without a basedir sccache keys on the path, so they would share nothing.
    # Both leaf dirs, not the parent: sccache keys on the unmatched remainder.
    SCCACHE_BASEDIRS: /platform/workspace/candidate:/platform/workspace/baseline
    # Incompatible with a shared compiler cache.
    CARGO_INCREMENTAL: "0"
    # Align every function to 64 bytes so that unchanged code keeps the same placement within
    # cache lines and uop-cache windows when unrelated code moves. Without it, identical machine
    # code was measured up to 30% apart (credit_card). Set here, not in run_benchmarks_ci.sh: the
    # baseline runs its own copy of that script, so a flag added there would apply to only one side.
    RUSTFLAGS: "-C llvm-args=-align-all-functions=6"

# Merges the parallel benchmark shards and posts a single PR comment. Each shard already uploaded its
# own results to S3 / the Benchmarking API with correct per-run metadata; this job only assembles the
# combined comment (pr-commenter uses --on-duplicate=replace, so exactly one job may comment).
benchmarks_combine:
  tags: ["arch:amd64"]
  needs:
    - job: benchmarks
      artifacts: true
      optional: true
  image:
    name: $BASE_CI_IMAGE
  rules: *benchmark_run_rules
  script:
    - |
      if ! ls -d "${CI_PROJECT_DIR}"/reports-*/ >/dev/null 2>&1; then
        echo "No shard reports produced -> nothing to combine."
        exit 0
      fi
    - !reference [.clone_benchmarking_platform, script]
    - |
      # Assemble the files post-pr-comment.sh reads by concatenating each shard's markdown.
      export ARTIFACTS_DIR="${CI_PROJECT_DIR}/reports"
      mkdir -p "${ARTIFACTS_DIR}/candidate" "${ARTIFACTS_DIR}/baseline"
      cat "${CI_PROJECT_DIR}"/reports-*/comparison-baseline-vs-candidate.md > "${ARTIFACTS_DIR}/comparison-baseline-vs-candidate.md" 2>/dev/null || :
      cat "${CI_PROJECT_DIR}"/reports-*/candidate/analysis-candidate.md     > "${ARTIFACTS_DIR}/candidate/analysis-candidate.md"     2>/dev/null || :
      cat "${CI_PROJECT_DIR}"/reports-*/baseline/analysis-baseline.md       > "${ARTIFACTS_DIR}/baseline/analysis-baseline.md"       2>/dev/null || :
      (cd /platform && ./steps/post-pr-comment.sh) || :
  artifacts:
    name: "reports-combined"
    paths:
      - reports/
    expire_in: 3 months
  variables:
    UPSTREAM_PROJECT_ID: $CI_PROJECT_ID
    UPSTREAM_PROJECT_NAME: $CI_PROJECT_NAME # libdatadog
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME
    UPSTREAM_COMMIT_SHA: $CI_COMMIT_SHA
    UPSTREAM_REPO_URL: "https://github.com/DataDog/libdatadog"

    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: libdatadog
