# Fuzzing job configuration
# This job discovers, builds, and uploads all cargo-fuzz targets to the internal fuzzing infrastructure
# See ci/README_FUZZING.md for more information

fuzz:
  tags: ["arch:amd64"]
  needs: []
  image:
    name: $BASE_CI_IMAGE
  rules:
    - !reference [.untrusted_ref_guard, rules]
    # runs on gitlab schedule and on merge to main.
    # Also allow manual run in branches for ease of debug / testing
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      allow_failure: true
    - when: manual
      allow_failure: true
  timeout: 1h
  script:
    - VAULT_VERSION=1.15.4
    - VAULT_SHA256=f42f550713e87cceef2f29a4e2b754491697475e3d26c0c5616314e40edd8e1b
    - curl -fsSL --retry 3 "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -o vault.zip
    - echo "${VAULT_SHA256}  vault.zip" | sha256sum -c -
    - unzip vault.zip && mv vault /usr/local/bin/vault && rm vault.zip && chmod +x /usr/local/bin/vault
    - NIGHTLY_VERSION=$(awk -F'"' '/^channel[[:space:]]*=/ {print $2}' nightly-toolchain.toml)
    - rustup default "$NIGHTLY_VERSION"
    - cargo +"$NIGHTLY_VERSION" install cargo-fuzz --locked
    - pip3 install requests toml
    - python3 fuzz/fuzz_infra.py
  allow_failure: true
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: libdatadog
