[package]
name = "libdd-dogstatsd-client"
description = "A dogstatsd client for sending metrics to a dogstatsd server."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-dogstatsd-client"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-dogstatsd-client"
rust-version.workspace = true
edition.workspace = true
version = "9.0.0"
license.workspace = true

[lib]
bench = false

[dependencies]
libdd-common = { version = "9.0.0", path = "../libdd-common", default-features = false, features = ["std"] }
libdd-networking = { version = "1.0.0", path = "../libdd-networking" }
cadence.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
tracing.workspace = true
anyhow.workspace = true
http = { workspace = true, features = ["std"] }
libdd-shared-runtime = { version = "7.0.0", path = "../libdd-shared-runtime", default-features = false, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
async-trait = { workspace = true, optional = true }

[features]
default = ["https"]
https = ["libdd-common/https"]
fips = ["libdd-common/fips"]
shared-runtime = ["dep:libdd-shared-runtime", "dep:tokio", "dep:async-trait"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "test-util", "rt-multi-thread"] }

[lints.clippy]
# TODO(paullgdc): This fails a lot because of if-let chaining which became
# allowed with the 1.91.1 MSRV bump.
# I am planning to fix each crate as an individual PR in order to not have 
# too many conflicts
collapsible_if = "allow"
