id: ffi-extern-c-panic-containment
language: rust
severity: warning
message: >-
  Exported FFI entry points must acknowledge panic containment.
  This covers `pub` functions and `#[no_mangle]` / `#[export_name]`
  functions whose ABI is `extern "C"`, bare `extern` (C by default),
  or `extern "system"`.
  Wrap the body with wrap_with_ffi_result!, wrap_with_void_ffi_result!,
  catch_panic!, or std::panic::catch_unwind. If containment is wrong
  here (trivial accessor, or datadog-sidecar-ffi which uses panic=abort),
  add `// allow(ffi-panic-boundary): <justification>` on a line directly
  above the function (attributes may sit in between).
note: |
  A panic that reaches an extern "C" or extern "system" boundary aborts
  the host process. Bare `extern fn` is extern "C". `#[no_mangle]` and
  `#[export_name]` export the symbol even when the function is not `pub`.
  A private extern callback without one of those attributes is not an
  entry point. `extern "C-unwind"` is a different ABI and is not matched.
  Clippy's panic/unwrap lints only see explicit panic constructs, not
  panics from callees. See AGENTS.md "Reliability & integrability".

  Accepted in-body markers: catch_unwind, catch_panic!, wrap_with_ffi_result!,
  wrap_with_void_ffi_result!, and the *_no_catch! variants (explicit
  acknowledgement). Empty `// allow(ffi-panic-boundary):` is not enough.
files:
  - "**/*.rs"
ignores:
  - "**/tests/**"
  - "**/examples/**"
  - "symbolizer-ffi/**"
rule:
  all:
    - kind: function_item
    # `pub(crate)` is not an export. `#[no_mangle]` / `#[export_name]` are,
    # even when the function is not `pub`.
    - any:
        - has:
            kind: visibility_modifier
            regex: "^pub$"
        - follows:
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
            kind: attribute_item
            has:
              stopBy: end
              kind: identifier
              regex: "^(no_mangle|export_name)$"
    # Bare `extern` defaults to C. `"system"` is stdcall on x86 Windows
    # and C elsewhere. Both abort on unwind. `"C-unwind"` does not.
    - has:
        kind: function_modifiers
        has:
          kind: extern_modifier
          any:
            - not:
                has:
                  kind: string_literal
            - has:
                kind: string_literal
                regex: '^"(C|system)"$'
    - not:
        has:
          stopBy: end
          any:
            - pattern: catch_unwind($$$A)
            - pattern: std::panic::catch_unwind($$$A)
            - kind: macro_invocation
              regex: "^(wrap_with_ffi_result|wrap_with_void_ffi_result|wrap_with_ffi_result_no_catch|wrap_with_void_ffi_result_no_catch|catch_panic)!"
    - not:
        follows:
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
          kind: line_comment
          regex: "allow\\(ffi-panic-boundary\\):\\s+\\S"
