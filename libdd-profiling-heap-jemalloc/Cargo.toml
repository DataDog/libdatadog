[package]
name = "libdd-profiling-heap-jemalloc"
version = "0.1.0"
description = "Drives libdd-profiling-heap-sampler's USDTs from jemalloc's own experimental sampling hooks."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-profiling-heap-jemalloc"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-profiling-heap-jemalloc"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
bench = false

[dependencies]
libdd-profiling-heap-sampler = { path = "../libdd-profiling-heap-sampler" }

# Linux-only: everything this crate does is `cfg(target_os = "linux")` (the
# USDT emission in libdd-profiling-heap-sampler is Linux-only), and the
# `tikv-jemalloc-ctl`/`tikv-jemalloc-sys` C build doesn't work on Windows. On
# every other target this compiles to an inert empty rlib. The `profiling`
# feature enables `jemalloc`'s `--enable-prof` (see `.cargo/config.toml` for
# the matching `JEMALLOC_SYS_WITH_MALLOC_CONF`).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemalloc-ctl = { git = "https://github.com/tikv/jemallocator", rev = "f1a76872af8f85843f9ae867536d6a089daa58cd", features = [
  "profiling",
  "use_std",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemallocator = { git = "https://github.com/tikv/jemallocator", rev = "f1a76872af8f85843f9ae867536d6a089daa58cd", features = ["profiling"] }
