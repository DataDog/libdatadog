[package]
name = "libdd-ai-usage"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-ai-usage"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-ai-usage"
description = "Usage and cost metric points for LLM provider calls and gateway requests, following the OpenTelemetry GenAI conventions"

[lib]
bench = false

[dependencies]
# The model events a Bedrock InvokeModelWithResponseStream chunk carries.
base64 = { workspace = true, features = ["std"] }
prost = { workspace = true, features = ["derive", "std"], optional = true }
libdd-ddsketch = { version = "1.1.4", path = "../libdd-ddsketch" }
hashbrown = { workspace = true, features = ["default-hasher", "inline-more"] }
memchr = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# Decodes the encoder's output with the upstream OTLP message definitions.
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "metrics"] }
prost = { workspace = true, features = ["derive", "std"] }

[features]
default = ["otlp"]
# Encode a MetricBatch as an OTLP ExportMetricsServiceRequest.
otlp = ["dep:prost"]
