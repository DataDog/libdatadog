[package]
name = "libdd-live-debugger-ffi"
version = "0.0.1"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[dependencies]
libdd-live-debugger = { path = "../libdd-live-debugger" }
libdd-common = { path = "../libdd-common" }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false }
percent-encoding = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4", "std"] }
serde_json.workspace = true
tokio = "1.36.0"
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4.21"

[features]
default = ["cbindgen"]
cbindgen = ["build_common/cbindgen", "libdd-common-ffi/cbindgen"]
regex-lite = ["libdd-live-debugger/regex-lite"]

[build-dependencies]
build_common = { path = "../build-common" }
