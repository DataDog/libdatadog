[package]
name = "libdd-process-utils"
version = "1.0.0"
description = "Process management, thread identification, and timeout utilities for Datadog libraries"
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-process-utils"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-process-utils"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
thiserror = { workspace = true, default-features = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
