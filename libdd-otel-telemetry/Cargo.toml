[package]
name = "libdd-otel-telemetry"
version = "0.1.0"
description = "Shared OpenTelemetry metrics/logs aggregation and OTLP export for Datadog tracers."
homepage = "https://github.com/DataDog/libdatadog/tree/main/libdd-otel-telemetry"
repository = "https://github.com/DataDog/libdatadog/tree/main/libdd-otel-telemetry"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
autobenches = false

[dependencies]
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, features = ["metrics"] }
libdd-shared-runtime = { version = "5.0.0", path = "../libdd-shared-runtime", default-features = false }
http = { workspace = true, optional = true }
# Only needed for the `http` exporter: reqwest+rustls needs a process-default crypto provider
# installed. libdatadog standardizes on ring (aws-lc-rs is FIPS-only), so pin the ring provider.
rustls = { workspace = true, features = ["ring"], optional = true }

[features]
default = ["grpc"]
grpc = ["opentelemetry-otlp/grpc-tonic", "dep:http"]
http = ["opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client", "dep:http", "dep:rustls"]
test-utils = []

[dev-dependencies]
libdd-shared-runtime = { version = "5.0.0", path = "../libdd-shared-runtime" }
