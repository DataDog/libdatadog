[package]
name = "libdd-ai-usage-ffi"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "C interface to libdd-ai-usage: LLM usage and cost metrics, provider usage parsing and DogStatsD packing for gateways in any language"

[lib]
# Loaded on its own (deprecated in favour of libdatadog's consolidated
# artifact), the library is named for its C prefix: `libdd_ai_usage_ffi.so`
# (`.dylib`, `.a`; `dd_ai_usage_ffi.dll`), not `liblibdd_ai_usage_ffi.so`.
name = "dd_ai_usage_ffi"
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
default = ["cbindgen", "catch_panic"]
# Report a panic at the boundary as an internal error instead of aborting the
# host process.
catch_panic = []
cbindgen = ["build_common/cbindgen", "libdd-common-ffi/cbindgen"]

[build-dependencies]
build_common = { path = "../build-common" }

[dependencies]
libdd-ai-usage = { path = "../libdd-ai-usage", version = "0.1.0", default-features = false }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
