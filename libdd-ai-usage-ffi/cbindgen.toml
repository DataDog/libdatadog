language = "C"
cpp_compat = true
tab_width = 2
header = """// Copyright 2026-Present Datadog, Inc. https://www.datadoghq.com/
// SPDX-License-Identifier: Apache-2.0
//
// Generated by cbindgen from libdd-ai-usage-ffi. Do not edit; run
// `UPDATE_HEADER=1 cargo test -p libdd-ai-usage-ffi --test header`.
"""
include_guard = "DDOG_AI_USAGE_H"
style = "both"
pragma_once = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[export]
prefix = "ddog_ai_usage_"
renaming_overrides_prefixing = true
# Field indices of `ddog_ai_usage_batch_add`, which no signature names.
include = ["Text", "Number"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
