language = "C"
cpp_compat = true
tab_width = 2
header = """// Copyright 2026-Present Datadog, Inc. https://www.datadoghq.com/
// SPDX-License-Identifier: Apache-2.0
"""
include_guard = "DDOG_AI_USAGE_H"
style = "both"
pragma_once = true

no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
includes = ["common.h"]

[export]
prefix = "ddog_ai_usage_"
renaming_overrides_prefixing = true

[export.rename]
"ByteSlice" = "ddog_ByteSlice"
"CharSlice" = "ddog_CharSlice"
"Slice_U8" = "ddog_Slice_U8"
"Slice_CChar" = "ddog_Slice_CChar"
"Error" = "ddog_Error"
"Vec_U8" = "ddog_Vec_U8"
"StringWrapper" = "ddog_StringWrapper"
"AiUsageError" = "ddog_ai_usage_Error"
"AiUsageErrorCode" = "ddog_ai_usage_ErrorCode"

[export.mangle]
rename_types = "PascalCase"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
must_use = "DDOG_CHECK_RETURN"

[parse]
parse_deps = true
include = ["libdd-common-ffi", "libdd-ai-usage"]
