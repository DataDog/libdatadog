[package]
name = "libdd-data-pipeline-ffi"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
default = ["cbindgen", "catch_panic"]
catch_panic = []
cbindgen = ["build_common/cbindgen", "libdd-common-ffi/cbindgen"]
regex-lite = ["libdd-data-pipeline/regex-lite"]
# Enable zstd compression for the agentless trace intake sender.
compression = ["libdd-data-pipeline/compression"]
# Forward `stats-obfuscation` to the underlying crate. This has no FFI surface of
# its own yet (client-side stats obfuscation is not configurable over the C API);
# it only compiles the capability into the linked data-pipeline crate.
stats-obfuscation = ["libdd-data-pipeline/stats-obfuscation"]
# Enable agentless APM trace export over the C FFI: exposes the agentless
# endpoint / timeout setters, the span obfuscation config setter, and the
# build-time wiring that forwards them to the trace exporter builder. Span
# obfuscation has no separate feature; it is part of the agentless path.
agentless = ["libdd-data-pipeline/agentless", "dep:serde_json"]

[build-dependencies]
build_common = { path = "../build-common" }

[dev-dependencies]
httpmock = "0.8.0-alpha.1"
rmp-serde = "1.3.0"
libdd-trace-utils = { path = "../libdd-trace-utils" }

[dependencies]
libdd-capabilities-impl = { version = "4.0.0", path = "../libdd-capabilities-impl" }
libdd-data-pipeline = { path = "../libdd-data-pipeline" }
libdd-shared-runtime = { version = "3.0.0", path = "../libdd-shared-runtime" }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false }
libdd-tinybytes = { path = "../libdd-tinybytes" }
libdd-trace-utils = { path = "../libdd-trace-utils" }
rmp = { version = "0.8.14", default-features = false }
tokio-util = "0.7.11"
tracing.workspace = true
serde_json = { workspace = true, optional = true }
libdd-trace-obfuscation = { version = "6.0.0", path = "../libdd-trace-obfuscation", default-features = false, optional = true }
