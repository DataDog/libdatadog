[package]
name = "libdd-data-pipeline-ffi"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
bench = false

[features]
# `stats-obfuscation` is default-on because the builder FFI bindings it gates
# (`ddog_trace_exporter_builder_enable_client_side_stats_obfuscation`,
# `ddog_trace_exporter_builder_set_agentless_stats_endpoint`) are declared in the generated
# header whenever cbindgen runs: cbindgen does not evaluate `#[cfg]`, so building with cbindgen
# but without stats-obfuscation would emit header declarations for symbols missing from the
# compiled library.
default = ["cbindgen", "catch_panic", "stats-obfuscation"]
catch_panic = []
cbindgen = ["build_common/cbindgen", "libdd-common-ffi/cbindgen"]
regex-lite = ["libdd-data-pipeline/regex-lite"]
# Enable zstd compression for the agentless trace intake sender.
compression = ["libdd-data-pipeline/compression"]
# Forward `stats-obfuscation` to the underlying crate. Default-on (see `default`): the
# feature gates builder methods that have FFI bindings, so the capability and the generated
# header must always be in sync.
stats-obfuscation = ["libdd-data-pipeline/stats-obfuscation"]

[build-dependencies]
build_common = { path = "../build-common" }

[dev-dependencies]
httpmock.workspace = true
rmp-serde.workspace = true
libdd-trace-utils = { path = "../libdd-trace-utils" }

[dependencies]
libdd-capabilities-impl = { version = "7.0.0", path = "../libdd-capabilities-impl" }
libdd-data-pipeline = { path = "../libdd-data-pipeline" }
libdd-shared-runtime = { version = "6.0.0", path = "../libdd-shared-runtime" }
libdd-common = { path = "../libdd-common", default-features = false }
libdd-common-ffi = { path = "../libdd-common-ffi", default-features = false, features = ["std"] }
libdd-tinybytes = { path = "../libdd-tinybytes" }
libdd-trace-utils = { path = "../libdd-trace-utils" }
rmp.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde_json.workspace = true
libdd-trace-obfuscation = { version = "10.0.0", path = "../libdd-trace-obfuscation", default-features = false }
